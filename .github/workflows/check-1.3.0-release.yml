name: Verify Flight Deck EFB 1.3.0 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-1.3.0-release.yml'

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Wait for published v1.3.0 release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            if gh release view v1.3.0 --repo checkner89/Flight-Deck-EFB >/dev/null 2>&1; then
              echo "Release v1.3.0 is visible."
              exit 0
            fi
            echo "Waiting for v1.3.0 release ($attempt/48)..."
            sleep 5
          done
          echo "Release v1.3.0 did not become visible in time." >&2
          exit 1

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          json=$(gh release view v1.3.0 --repo checkner89/Flight-Deck-EFB --json tagName,isDraft,isPrerelease,url,assets)
          echo "$json"
          test "$(echo "$json" | jq -r '.tagName')" = "v1.3.0"
          test "$(echo "$json" | jq -r '.isDraft')" = "false"
          test "$(echo "$json" | jq -r '.isPrerelease')" = "false"
          names=$(echo "$json" | jq -r '.assets[].name')
          echo "$names" | grep -Fx 'Flight-Deck-EFB-Setup-1.3.0.exe'
          echo "$names" | grep -Fx 'Flight-Deck-EFB-Setup-1.3.0.exe.blockmap'
          echo "$names" | grep -Fx 'latest.yml'
          url=$(echo "$json" | jq -r '.url')
          mkdir -p release-status
          printf 'status=success\nversion=1.3.0\ntag=v1.3.0\nurl=%s\n' "$url" > release-status/1.3.0.txt

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/1.3.0.txt
          git commit -m 'Record verified Flight Deck EFB 1.3.0 release'
          git push origin HEAD:main
