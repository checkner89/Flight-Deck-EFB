name: Validate Release Branch

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and prepare release
        run: npm install

      - name: Verify modified source
        shell: pwsh
        run: |
          node --check scripts/prepare-release-1.20.5-compat.mjs
          node --check scripts/apply-release-1.19.0.mjs
          node --check scripts/apply-release-1.20.0.mjs
          node --check scripts/apply-release-1.20.1.mjs
          node --check scripts/apply-release-1.20.2.mjs
          node --check scripts/apply-release-1.20.3.mjs
          node --check scripts/apply-release-1.20.4.mjs
          node --check scripts/apply-release-1.20.5.mjs
          node --check scripts/prepare-release-1.19.0-notes.mjs
          node --check scripts/prepare-release-1.20.1-notes.mjs
          node --check scripts/apply-release-1.17.19.mjs
          node --check scripts/prepare-operations-suite.mjs
          node --check scripts/test-pilot-tools.mjs
          node --check scripts/test-release-1.19.0.mjs
          node --check scripts/test-release-1.20.0.mjs
          node --check scripts/test-release-1.20.5.mjs
          node --check src/lan-discovery-service.mjs
          node --check src/windows-sim-session.mjs
          node --check src/msfs-addon-scanner.mjs
          node --check src/news-feed-service.mjs
          node --check src/local-path-discovery.mjs
          node --check src/simbrief-client.mjs
          node --check src/file-browser-service.mjs
          node --check src/file-browser-routes.mjs
          node --check src/simconnect-client.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/state-engine.mjs
          node --check src/taxi-route-planner.mjs
          node --check src/msfs-efb-package-builder.mjs
          node --check src/server.mjs
          node --check src/electron-main.mjs
          node --check public/app.js
          node --check public/live-traffic.js
          node --check public/flight-overlay.js
          node --check public/si-operations.js
          node --check public/gsx-profile-manager.js
          node --check public/release-1.7.19.js
          node --check public/release-1.20.4.js
          node --check public/pilot-tools.js
          node --check public/sim-session-native.js
          node --check public/news-app.js
          node --check public/documents-workspace.js
          node --check public/file-browser.js

      - name: Run traffic and integration regressions
        shell: pwsh
        run: |
          node scripts/test-live-traffic.mjs
          if (Test-Path 'scripts/test-traffic-merge.mjs') { node scripts/test-traffic-merge.mjs }
          node scripts/verify-msfs-efb-builder.mjs
          node scripts/test-gsx-profile-manager.mjs
          node scripts/test-pilot-tools.mjs
          node scripts/test-release-1.19.0.mjs
          node scripts/test-release-1.20.5.mjs

      - name: Verify release assets are wired
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $escapedVersion = [regex]::Escape($version)
          $html = Get-Content 'public/index.html' -Raw
          if ($html -notmatch 'release-1\.7\.19\.css' -or $html -notmatch 'release-1\.7\.19\.js') { throw '1.17.19 compatibility assets are not wired into index.html.' }
          if ($html -notmatch "pilot-tools\.css\?v=$escapedVersion" -or $html -notmatch "pilot-tools\.js\?v=$escapedVersion") { throw "$version pilot tools are not wired into index.html." }
          if ($html -notmatch "sim-session-native\.css\?v=$escapedVersion" -or $html -notmatch "sim-session-native\.js\?v=$escapedVersion") { throw "$version Flight Setup assets are not wired into index.html." }
          if ($html -notmatch "news-app\.css\?v=$escapedVersion" -or $html -notmatch "news-app\.js\?v=$escapedVersion") { throw "$version News app is not wired into index.html." }
          if ($html -notmatch "release-1\.20\.0\.css\?v=$escapedVersion") { throw 'Airport-only polish is not wired.' }
          if ($html -notmatch "release-1\.20\.1\.css\?v=$escapedVersion") { throw '1.20.1 theme compatibility stylesheet is not wired.' }
          if ($html -notmatch "release-1\.20\.2\.css\?v=$escapedVersion") { throw '1.20.2 unified UI stylesheet is not wired.' }
          if ($html -notmatch "release-1\.20\.4\.css\?v=$escapedVersion" -or $html -notmatch "release-1\.20\.4\.js\?v=$escapedVersion") { throw "$version cockpit shell assets are not wired into index.html." }
          if ($html -notmatch "documents-workspace\.css\?v=$escapedVersion-docs2" -or $html -notmatch "documents-workspace\.js\?v=$escapedVersion-docs2") { throw "$version complete OFP workspace is not wired into index.html." }
          if ($html -notmatch "file-browser\.css\?v=$escapedVersion" -or $html -notmatch "file-browser\.js\?v=$escapedVersion") { throw "$version file browser assets are not wired into index.html." }
          if ($html -match 'operations-suite\.(?:js|css)\?v=') { throw 'Duplicate 1.18.0 operations suite is still wired into the app.' }
          if ($html -notmatch 'data-i18n="flightNotes">Flight Notes</h3>') { throw 'Existing Flight Hub note area still claims to be the Scratchpad.' }
          $server = Get-Content 'src/server.mjs' -Raw
          if ($server -notmatch '/api/gsx/profile-library' -or $server -notmatch 'scanGsxProfileLibrary') { throw 'GSX automatic path discovery API is missing.' }
          if ($server -notmatch '/api/sim-session/status' -or $server -notmatch '/api/sim-session/screenshot' -or $server -notmatch 'LanDiscoveryService') { throw 'Native Flight Setup API is incomplete.' }
          if ($server -notmatch '/api/news/feed' -or $server -notmatch '/api/news/article' -or $server -notmatch 'NewsFeedService') { throw 'Enhanced News API is incomplete.' }
          if ($server -notmatch '/api/simbrief/document' -or $server -notmatch '/api/simbrief/ofp') { throw 'Complete SimBrief OFP endpoints are missing.' }
          if ($server -notmatch 'handleFileBrowserRequest' -or $server -notmatch "pathname\.startsWith\('/api/files/'\)") { throw 'File browser API delegation is missing.' }
          $simbrief = Get-Content 'src/simbrief-client.mjs' -Raw
          if ($simbrief -notmatch "plan_html" -or $simbrief -notmatch "json', 'v2'" -or $simbrief -notmatch 'latestDocument') { throw 'Complete SimBrief JSON v2 OFP import is incomplete.' }
          $pilot = Get-Content 'public/pilot-tools.js' -Raw
          if ($pilot -notmatch 'pointerdown' -or $pilot -notmatch 'pointermove' -or $pilot -notmatch 'exportScratchpadPng') { throw 'Real drawing scratchpad is incomplete.' }
          if ($pilot -notmatch 'PEN_COLORS' -or $pilot -notmatch 'MARKER_COLORS' -or $pilot -notmatch 'data-scratch-image-add') { throw 'Scratchpad colors or image support are incomplete.' }
          if ($pilot -match 'SMART CHECKLISTS|VATSIM_URL|currentFlightLog|Fuel Receipt') { throw 'A duplicate 1.18 feature is still bundled into Pilot Tools.' }
          if ($pilot -notmatch 'schedulePilotTileSync' -or $pilot -notmatch 'pilotLabelSignature') { throw 'Renderer mutation-loop recovery is missing.' }
          if ($pilot -notmatch 'Flight Setup' -or $pilot -match 'sim-session-internal') { throw 'Flight Setup redesign is incomplete.' }
          $news = Get-Content 'public/news-app.js' -Raw
          if ($news -notmatch 'news-reader' -or $news -notmatch '/api/news/article' -or $news -notmatch 'news-card-image' -or $news -notmatch 'favicon.ico') { throw 'Rich in-app News reader is incomplete.' }
          $newsService = Get-Content 'src/news-feed-service.mjs' -Raw
          if ($newsService -notmatch 'content: fullContent' -or $newsService -notmatch 'async article\(id\)' -or $newsService -notmatch 'extractContentBlocks') { throw 'Enhanced News article extraction is incomplete.' }
          $documents = Get-Content 'public/documents-workspace.js' -Raw
          if ($documents -notmatch 'indexedDB' -or $documents -notmatch 'highlighter' -or $documents -notmatch 'fdDocsRedo' -or $documents -notmatch 'fullSimBriefOfpHtml' -or $documents -notmatch 'fd-docs-commandbar') { throw 'Complete OFP/Documents workspace is incomplete.' }
          $documentsCss = Get-Content 'public/documents-workspace.css' -Raw
          if ($documentsCss -notmatch 'html\[data-theme="light"\]' -or $documentsCss -notmatch '--fd-docs-bg:\s*#071019') { throw 'OFP/Documents Light/Dark themes are incomplete.' }
          $releaseCss = Get-Content 'public/release-1.20.4.css' -Raw
          if ($releaseCss -notmatch 'fd-global-rail' -or $releaseCss -notmatch 'data-theme="light"') { throw '1.20.4 cockpit-wide Light/Dark UI is incomplete.' }
          $fileBrowser = Get-Content 'public/file-browser.js' -Raw
          if ($fileBrowser -notmatch 'data-fd-files-launcher' -or $fileBrowser -notmatch 'renderPreview' -or $fileBrowser -notmatch 'uploadFiles' -or $fileBrowser -notmatch 'runSearch') { throw 'Complete file browser UI is incomplete.' }
          $fileService = Get-Content 'src/file-browser-service.mjs' -Raw
          if ($fileService -notmatch 'remoteAllowedRoots' -or $fileService -notmatch 'assertWritable' -or $fileService -notmatch 'receiveUpload') { throw 'File browser security or file operations are incomplete.' }
          if ($version -ne '1.20.5') { throw "Unexpected package version: $version" }
          Write-Host 'Release 1.20.5 validation passed.'
