name: Validate Release Branch

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and materialize release
        run: npm install

      - name: Verify JavaScript and release scripts
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem 'scripts' -Filter '*.mjs' -File
          $files += Get-ChildItem 'src' -Filter '*.mjs' -File
          $files += Get-ChildItem 'public' -Filter '*.js' -File
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Run traffic and integration regressions
        shell: pwsh
        run: |
          node scripts/test-live-traffic.mjs
          if (Test-Path 'scripts/test-traffic-merge.mjs') { node scripts/test-traffic-merge.mjs }
          node scripts/verify-msfs-efb-builder.mjs
          node scripts/test-gsx-profile-manager.mjs
          node scripts/test-pilot-tools.mjs
          node scripts/test-release-1.19.0.mjs
          node scripts/test-release-1.20.5.mjs
          if (Test-Path 'scripts/test-release-1.20.6.mjs') { node scripts/test-release-1.20.6.mjs }
          if (Test-Path 'scripts/test-release-1.20.7.mjs') { node scripts/test-release-1.20.7.mjs }
          if (Test-Path 'scripts/test-release-1.20.9.mjs') { node scripts/test-release-1.20.9.mjs }
          if (Test-Path 'scripts/test-release-1.20.10.mjs') { node scripts/test-release-1.20.10.mjs }

      - name: Verify release assets are wired
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $escapedVersion = [regex]::Escape($version)
          $html = Get-Content 'public/index.html' -Raw

          if ($html -notmatch 'release-1\.7\.19\.css' -or $html -notmatch 'release-1\.7\.19\.js') { throw '1.17.19 compatibility assets are not wired.' }
          if ($html -notmatch "pilot-tools\.css\?v=$escapedVersion" -or $html -notmatch "pilot-tools\.js\?v=$escapedVersion") { throw "$version pilot tools are not wired." }
          if ($html -notmatch "sim-session-native\.css\?v=$escapedVersion" -or $html -notmatch "sim-session-native\.js\?v=$escapedVersion") { throw "$version Flight Setup assets are not wired." }
          if ($html -notmatch "news-app\.css\?v=$escapedVersion" -or $html -notmatch "news-app\.js\?v=$escapedVersion") { throw "$version News app is not wired." }
          if ($html -notmatch "release-1\.20\.4\.css\?v=$escapedVersion" -or $html -notmatch "release-1\.20\.4\.js\?v=$escapedVersion") { throw "$version cockpit shell assets are not wired." }
          if ($html -notmatch "documents-workspace\.css\?v=$escapedVersion(?:-docs[0-9]+)?" -or $html -notmatch "documents-workspace\.js\?v=$escapedVersion(?:-docs[0-9]+)?") { throw "$version OFP workspace is not wired." }
          if ($html -notmatch "file-browser\.css\?v=$escapedVersion" -or $html -notmatch "file-browser\.js\?v=$escapedVersion") { throw "$version file browser is not wired." }

          if ($version -eq '1.20.10') {
            if ($html -notmatch "release-1\.20\.9\.css\?v=$escapedVersion") { throw '1.20.9 tracking compatibility stylesheet is not wired.' }
            if ($html -notmatch "release-1\.20\.10\.css\?v=$escapedVersion") { throw '1.20.10 tracking layout stylesheet is not wired.' }
            if ($html -notmatch 'tracking-context-callsign' -or $html -notmatch '<i class="simbrief"></i>') { throw '1.20.10 tracking markup is incomplete.' }
          }

          $server = Get-Content 'src/server.mjs' -Raw
          if ($server -notmatch "const APP_VERSION = '$escapedVersion';") { throw "Server version does not match $version." }

          $simbrief = Get-Content 'src/simbrief-client.mjs' -Raw
          if ($simbrief -notmatch 'navlogFixes' -or $simbrief -notmatch 'pos_lon' -or $simbrief -notmatch 'latestDocument') { throw 'Robust SimBrief OFP/navlog support is incomplete.' }

          $app = Get-Content 'public/app.js' -Raw
          if ($version -eq '1.20.10' -and ($app -notmatch 'trackingSimBriefPoints' -or $app -notmatch 'trackingLayers\.simbrief' -or $app -notmatch 'archive-only')) {
            throw '1.20.10 map-first Tracking integration is incomplete.'
          }

          Write-Host "Release $version validation passed."
