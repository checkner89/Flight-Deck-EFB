name: Debug 1.23.1 Renderer

on:
  push:
    branches:
      - 'release/debug-1.23.1-renderer'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Materialize 1.23.1
        run: npm install
      - name: Print failing app binding area
        shell: pwsh
        run: |
          $lines = Get-Content 'public/app.js'
          $start = [Math]::Max(0, 5545)
          $end = [Math]::Min($lines.Length - 1, 5575)
          for ($i = $start; $i -le $end; $i++) {
            Write-Host (("{0,5}: {1}" -f ($i + 1), $lines[$i]))
          }
          Write-Host "TOTAL APP LINES: $($lines.Length)"
          Write-Host '--- element bindings around footer ---'
          Select-String -Path 'public/app.js' -Pattern 'addEventListener' | Select-Object -Last 35 | ForEach-Object { Write-Host ("$($_.LineNumber): $($_.Line)") }
          Write-Host '--- NEWS / HOME IDs in HTML ---'
          Select-String -Path 'public/index.html' -Pattern 'news|home-|plan-button|destination-prefetch|weather-refresh|export-backup|import-backup' | ForEach-Object { Write-Host ("$($_.LineNumber): $($_.Line)") }
