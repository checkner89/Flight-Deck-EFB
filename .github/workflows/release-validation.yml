name: Validate Release Branch

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and materialize current release
        run: npm install

      - name: Verify JavaScript and release sources
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem 'scripts' -Filter '*.mjs' -File
          $files += Get-ChildItem 'src' -Filter '*.mjs' -File
          $files += Get-ChildItem 'public' -Filter '*.js' -File
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Run current core regressions
        shell: pwsh
        run: |
          npm run test:ops
          if ($LASTEXITCODE -ne 0) { throw 'Operational regression suite failed.' }

          npm run test:ui
          if ($LASTEXITCODE -ne 0) { throw 'UI regression suite failed.' }

          npm run test:ground
          if ($LASTEXITCODE -ne 0) { throw 'Ground/Taxi regression suite failed.' }

          npm run test:com
          if ($LASTEXITCODE -ne 0) { throw 'COM regression suite failed.' }

          npm run test:atc
          if ($LASTEXITCODE -ne 0) { throw 'ATC regression suite failed.' }

          npm run test:profiles
          if ($LASTEXITCODE -ne 0) { throw 'Aircraft/GSX profile regression suite failed.' }

      - name: Run Traffic and integration regressions
        shell: pwsh
        run: |
          node scripts/test-live-traffic.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Live Traffic regression failed.' }

          if (Test-Path 'scripts/test-traffic-merge.mjs') {
            node scripts/test-traffic-merge.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Traffic merge regression failed.' }
          }

          node scripts/verify-msfs-efb-builder.mjs
          if ($LASTEXITCODE -ne 0) { throw 'MSFS EFB builder verification failed.' }

          node scripts/verify-installer-legal.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer/legal verification failed.' }

      - name: Verify current release wiring
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $escapedVersion = [regex]::Escape($version)
          $html = Get-Content 'public/index.html' -Raw
          $server = Get-Content 'src/server.mjs' -Raw
          $serviceWorker = Get-Content 'public/service-worker.js' -Raw
          $electronMain = Get-Content 'src/electron-main.mjs' -Raw

          if ($html -notmatch "data-app-version=\"$escapedVersion\"") {
            throw "Renderer version does not match $version."
          }
          if ($server -notmatch "const APP_VERSION = '$escapedVersion';") {
            throw "Server version does not match $version."
          }
          if ($serviceWorker -notmatch [regex]::Escape($version)) {
            throw "Service worker cache does not match $version."
          }
          if ($html -notmatch "pilot-tools\.js\?v=$escapedVersion" -or $html -notmatch "sim-session-native\.js\?v=$escapedVersion") {
            throw "$version current pilot/runtime assets are not wired."
          }
          if ($html -notmatch "documents-workspace\.js\?v=$escapedVersion(?:-docs[0-9]+)?" -or $html -notmatch "file-browser\.js\?v=$escapedVersion") {
            throw "$version current document/file workspaces are not wired."
          }

          if ($version -eq '1.24.13') {
            if ($html -match 'news-app\.(?:js|css)' -or $serviceWorker -match 'news-app\.(?:js|css)' -or $server -match '/api/news/') {
              throw '1.24.13 News-removal regression detected.'
            }
            if ($electronMain -match "mainWindow\.on\('close'[\s\S]{0,240}event\.preventDefault\(\)") {
              throw '1.24.13 close-to-tray regression detected.'
            }
            if ($electronMain -notmatch "app\.on\('window-all-closed', \(\) => \{\s*app\.quit\(\);\s*\}\);") {
              throw '1.24.13 quit-on-window-close behavior is missing.'
            }
          }

          Write-Host "Release $version validation passed."
