name: Validate Release Branch

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and prepare release
        run: npm install

      - name: Verify modified source
        shell: pwsh
        run: |
          node --check scripts/apply-release-1.19.0.mjs
          node --check scripts/apply-release-1.20.0.mjs
          node --check scripts/apply-release-1.20.1.mjs
          node --check scripts/prepare-release-1.19.0-notes.mjs
          node --check scripts/prepare-release-1.20.1-notes.mjs
          node --check scripts/apply-release-1.17.19.mjs
          node --check scripts/prepare-operations-suite.mjs
          node --check scripts/test-pilot-tools.mjs
          node --check scripts/test-release-1.19.0.mjs
          node --check scripts/test-release-1.20.0.mjs
          node --check src/lan-discovery-service.mjs
          node --check src/windows-sim-session.mjs
          node --check src/msfs-addon-scanner.mjs
          node --check src/news-feed-service.mjs
          node --check src/local-path-discovery.mjs
          node --check src/simconnect-client.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/state-engine.mjs
          node --check src/taxi-route-planner.mjs
          node --check src/msfs-efb-package-builder.mjs
          node --check src/server.mjs
          node --check src/electron-main.mjs
          node --check public/app.js
          node --check public/live-traffic.js
          node --check public/flight-overlay.js
          node --check public/si-operations.js
          node --check public/gsx-profile-manager.js
          node --check public/release-1.7.19.js
          node --check public/pilot-tools.js
          node --check public/sim-session-native.js
          node --check public/news-app.js

      - name: Run traffic and integration regressions
        shell: pwsh
        run: |
          node scripts/test-live-traffic.mjs
          if (Test-Path 'scripts/test-traffic-merge.mjs') { node scripts/test-traffic-merge.mjs }
          node scripts/verify-msfs-efb-builder.mjs
          node scripts/test-gsx-profile-manager.mjs
          node scripts/test-pilot-tools.mjs
          node scripts/test-release-1.19.0.mjs
          node scripts/test-release-1.20.0.mjs

      - name: Verify release assets are wired
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $escapedVersion = [regex]::Escape($version)
          $html = Get-Content 'public/index.html' -Raw
          if ($html -notmatch 'release-1\.7\.19\.css' -or $html -notmatch 'release-1\.7\.19\.js') { throw '1.17.19 compatibility assets are not wired into index.html.' }
          if ($html -notmatch "pilot-tools\.css\?v=$escapedVersion" -or $html -notmatch "pilot-tools\.js\?v=$escapedVersion") { throw "$version pilot tools are not wired into index.html." }
          if ($html -notmatch "sim-session-native\.css\?v=$escapedVersion" -or $html -notmatch "sim-session-native\.js\?v=$escapedVersion") { throw "$version Flight Setup assets are not wired into index.html." }
          if ($html -notmatch "news-app\.css\?v=$escapedVersion" -or $html -notmatch "news-app\.js\?v=$escapedVersion") { throw "$version News app is not wired into index.html." }
          if ($html -notmatch "release-1\.20\.0\.css\?v=$escapedVersion") { throw 'Airport-only polish is not wired.' }
          if ($html -notmatch "release-1\.20\.1\.css\?v=$escapedVersion") { throw '1.20.1 theme compatibility stylesheet is not wired.' }
          if ($html -match 'operations-suite\.(?:js|css)\?v=') { throw 'Duplicate 1.18.0 operations suite is still wired into the app.' }
          if ($html -notmatch 'data-i18n="flightNotes">Flight Notes</h3>') { throw 'Existing Flight Hub note area still claims to be the Scratchpad.' }
          $server = Get-Content 'src/server.mjs' -Raw
          if ($server -notmatch '/api/gsx/profile-library' -or $server -notmatch 'scanGsxProfileLibrary') { throw 'GSX automatic path discovery API is missing.' }
          if ($server -notmatch '/api/sim-session/status' -or $server -notmatch '/api/sim-session/screenshot' -or $server -notmatch 'LanDiscoveryService') { throw 'Native Flight Setup API is incomplete.' }
          if ($server -notmatch '/api/news/feed' -or $server -notmatch 'NewsFeedService') { throw 'News API is incomplete.' }
          $pilot = Get-Content 'public/pilot-tools.js' -Raw
          if ($pilot -notmatch 'pointerdown' -or $pilot -notmatch 'pointermove' -or $pilot -notmatch 'exportScratchpadPng') { throw 'Real drawing scratchpad is incomplete.' }
          if ($pilot -match 'SMART CHECKLISTS|VATSIM_URL|currentFlightLog|Fuel Receipt') { throw 'A duplicate 1.18 feature is still bundled into Pilot Tools.' }
          if ($pilot -notmatch 'schedulePilotTileSync' -or $pilot -notmatch 'pilotLabelSignature') { throw 'Renderer mutation-loop recovery is missing.' }
          if ($pilot -notmatch 'Flight Setup' -or $pilot -match 'sim-session-internal') { throw 'Flight Setup redesign is incomplete.' }
          $news = Get-Content 'public/news-app.js' -Raw
          if ($news -notmatch 'news-reader' -or $news -notmatch 'IN FLIGHT DECK LESEN' -or $news -notmatch 'OPEN ORIGINAL') { throw 'In-app News reader is incomplete.' }
          $newsService = Get-Content 'src/news-feed-service.mjs' -Raw
          if ($newsService -notmatch 'content: fullContent' -or $newsService -notmatch 'slice\(0, 12000\)') { throw 'Feed-supplied article content is not exposed to the News reader.' }
          if ($version -ne '1.20.1') { throw "Unexpected package version: $version" }
          Write-Host 'Release 1.20.1 validation passed.'
