name: Apply Phase 1 connectors 1.5.0

on:
  push:
    branches:
      - phase1-connectors-1.5.0
    paths:
      - '.github/workflows/apply-phase1-1.5.0.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: phase1-connectors-1.5.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply migration
        run: python scripts/apply-phase1-1.5.0.py

      - name: Bump package version
        run: npm version 1.5.0 --no-git-tag-version

      - name: Verify JavaScript syntax
        run: |
          node --check src/littlenavmap-client.mjs
          node --check src/simconnect-client.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/sayintentions-client.mjs
          node --check src/simbrief-client.mjs
          node --check src/online-network-client.mjs
          node --check src/state-engine.mjs
          node --check src/server.mjs
          node --check src/electron-main.mjs
          node --check public/app.js
          node --check public/service-worker.js

      - name: Commit Phase 1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md README.md src public
          git commit -m 'Implement Phase 1 MSFS connectors'
          git push origin HEAD:phase1-connectors-1.5.0
