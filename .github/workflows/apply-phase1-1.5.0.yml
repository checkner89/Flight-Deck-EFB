name: Verify Phase 1 connectors 1.5.0

on:
  push:
    branches:
      - phase1-connectors-1.5.0
    paths:
      - '.github/workflows/apply-phase1-1.5.0.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: phase1-connectors-1.5.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify application source
        run: |
          node --check src/littlenavmap-client.mjs
          node --check src/simconnect-client.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/sayintentions-client.mjs
          node --check src/simbrief-client.mjs
          node --check src/online-network-client.mjs
          node --check src/state-engine.mjs
          node --check src/server.mjs
          node --check src/electron-main.mjs
          node --check public/app.js
          node --check public/service-worker.js

      - name: Test connector normalization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { summarizeSimBrief } from './src/simbrief-client.mjs';
          import { LittleNavmapClient } from './src/littlenavmap-client.mjs';
          import { OnlineNetworkClient } from './src/online-network-client.mjs';

          const simbrief = summarizeSimBrief({
            general: { callsign: 'DLH123', route: 'EDDF DCT EDDM', sid: 'MARUN1F', star: 'BETOS2A', initial_altitude: '35000', cruise_mach: '0.78' },
            origin: { icao_code: 'EDDF', plan_rwy: '25C', pos_lat: '50.0', pos_long: '8.5' },
            destination: { icao_code: 'EDDM', plan_rwy: '26R', pos_lat: '48.35', pos_long: '11.79' },
            aircraft: { icaocode: 'A320', reg: 'D-AABC' },
            weights: { pax_count: '150', est_tow: '150000' },
            fuel: { plan_ramp: '20000' },
            times: { est_time_enroute: '3600' },
            navlog: { fix: [{ ident: 'MARUN', pos_lat: '50.1', pos_long: '8.7' }] },
            params: { time_generated: '1700000000' },
          }, 'test');
          assert.equal(simbrief.flight.sid, 'MARUN1F');
          assert.equal(simbrief.flight.star, 'BETOS2A');
          assert.equal(simbrief.flight.navlogCount, 1);

          const lnmState = {};
          const lnmEngine = { setIntegration: (name, value) => { lnmState[name] = { ...(lnmState[name] || {}), ...value }; } };
          const lnmFetch = async (url) => ({
            ok: true,
            json: async () => String(url).includes('airport/info')
              ? { ident: 'EDDM', name: 'Munich', position: { lat: 48.35, lon: 11.79 }, com: { Tower: 118700 } }
              : { active: true, position: { lat: 48.3, lon: 11.8 }, simconnect_status: 'No error', ground_speed: 12 },
          });
          const lnm = new LittleNavmapClient(lnmEngine, { fetchImpl: lnmFetch });
          assert.equal((await lnm.refresh()).simulatorConnected, true);
          assert.equal((await lnm.getAirport('EDDM')).com.Tower, 118.7);

          const netState = { integrations: {} };
          const netEngine = {
            publicState: () => ({ flight: { origin: 'EDDF', destination: 'EDDM', currentAirport: 'EDDF' }, planning: {}, aircraft: { lat: 50, lon: 8.5 } }),
            setIntegration: (name, value) => { netState.integrations[name] = { ...(netState.integrations[name] || {}), ...value }; },
          };
          const net = new OnlineNetworkClient(netEngine, { fetchImpl: async () => ({ ok: true, json: async () => ({ general: { connected_clients: 1 }, controllers: [], atis: [], pilots: [{ callsign: 'DLH123', latitude: 50.1, longitude: 8.6, flight_plan: { departure: 'EDDF', arrival: 'EDDM' } }] }) }) });
          assert.equal((await net.refresh('vatsim')).pilots.length, 1);
          console.log('Connector normalization checks passed.');
          NODE

      - name: Smoke test local EFB host
        shell: bash
        run: |
          node src/server.mjs --demo --port 8745 >/tmp/efb.out 2>/tmp/efb.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8745/ | grep -q 'Flight Deck EFB'; then
              echo 'Flight Deck EFB host smoke test passed.'
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/efb.out || true
          cat /tmp/efb.err || true
          exit 1
