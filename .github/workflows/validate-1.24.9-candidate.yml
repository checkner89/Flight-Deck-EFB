name: Validate 1.24.9 Candidate

on:
  push:
    branches:
      - 'release/1.24.9'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-candidate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install and materialize candidate
        run: npm install

      - name: Verify generated JavaScript
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem 'scripts' -Filter '*.mjs' -File
          $files += Get-ChildItem 'src' -Filter '*.mjs' -File
          $files += Get-ChildItem 'public' -Filter '*.js' -File
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }

      - name: Run UI regressions
        run: npm run test:ui

      - name: Run operational regressions
        run: npm run test:ops

      - name: Build Windows candidate
        run: npm run dist

      - name: Verify candidate artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.24.8') { throw "Candidate must remain on published base 1.24.8, got $version" }
          $required = @(
            "dist/FLYXORA-Setup-$version.exe",
            "dist/FLYXORA-Setup-$version.exe.blockmap",
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing candidate artifact: $file" }
          }
