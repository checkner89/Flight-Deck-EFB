name: Verify UI Taxi 1.7.2

on:
  push:
    branches: [hotfix-msfs-efb-builder-1.7.2]
    paths: ['.github/workflows/ui-taxi-1.7.2.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix-msfs-efb-builder-1.7.2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply UI and taxi fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('public/app.js')
          s = app.read_text(encoding='utf-8')

          # Taxi: entering the module enables follow and focuses aircraft; route rendering must not disable it.
          old = """  if (taxiActive) {
            setTimeout(() => {
              map.invalidateSize();
              fitRoute();
            }, 60);
          }
          """
          new = """  if (taxiActive) {
            followAircraft = true;
            syncFollowButton();
            setTimeout(() => {
              map.invalidateSize();
              const aircraft = latestState?.aircraft;
              if (aircraft && Number.isFinite(aircraft.lat) && Number.isFinite(aircraft.lon)) {
                map.setView([aircraft.lat, aircraft.lon], Math.max(map.getZoom(), 17.5), { animate: false });
                renderAircraft(aircraft);
              } else {
                fitRoute({ disableFollow: false });
              }
            }, 100);
          }
          """
          if old not in s: raise SystemExit('taxi switch anchor missing')
          s = s.replace(old, new, 1)

          old = """  fitRoute();
          }

          function escapeHtml"""
          new = """  fitRoute({ disableFollow: false });
          }

          function escapeHtml"""
          if old not in s: raise SystemExit('renderPath fit anchor missing')
          s = s.replace(old, new, 1)

          old = """function fitRoute() {
            const path = latestState?.taxi?.path ?? [];
          """
          new = """function fitRoute({ disableFollow = true } = {}) {
            const path = latestState?.taxi?.path ?? [];
          """
          if old not in s: raise SystemExit('fitRoute signature missing')
          s = s.replace(old, new, 1)
          old = """  if (coordinates.length >= 2) {
              followAircraft = false;
              syncFollowButton();
              map.fitBounds(coordinates, { padding: [100, 100], maxZoom: 18.6, animate: true });
          """
          new = """  if (coordinates.length >= 2) {
              if (disableFollow) {
                followAircraft = false;
                syncFollowButton();
              }
              if (!followAircraft || !latestState?.aircraft || !Number.isFinite(latestState.aircraft.lat) || !Number.isFinite(latestState.aircraft.lon)) {
                map.fitBounds(coordinates, { padding: [100, 100], maxZoom: 18.6, animate: true });
              }
          """
          if old not in s: raise SystemExit('fitRoute body missing')
          s = s.replace(old, new, 1)

          # Aircraft adapter submenu.
          s = s.replace("  atcTabButtons: [...document.querySelectorAll('[data-atc-tab]')],\n", "  atcTabButtons: [...document.querySelectorAll('[data-atc-tab]')],\n  aircraftViewButtons: [...document.querySelectorAll('[data-aircraft-view-button]')],\n")
          marker = "function setFlightHubTab(tab) {"
          fn = """function setAircraftView(view = 'fenix') {
            const selected = ['fenix', 'pmdg', 'status'].includes(view) ? view : 'fenix';
            for (const button of elements.aircraftViewButtons || []) button.classList.toggle('active', button.dataset.aircraftViewButton === selected);
            for (const panel of document.querySelectorAll('[data-aircraft-view]')) panel.hidden = panel.dataset.aircraftView !== selected;
            if (selected === 'fenix') setTimeout(() => elements.fenixFrame?.contentWindow && elements.fenixFrame.getBoundingClientRect(), 0);
          }

          """
          if marker not in s: raise SystemExit('aircraft view function anchor missing')
          s = s.replace(marker, fn + marker, 1)
          listener_marker = "for (const button of elements.siMessageViewButtons) {"
          listener = """for (const button of elements.aircraftViewButtons || []) {
            button.addEventListener('click', () => setAircraftView(button.dataset.aircraftViewButton));
          }
          setAircraftView('fenix');
          """
          if listener_marker not in s: raise SystemExit('aircraft listener anchor missing')
          s = s.replace(listener_marker, listener + listener_marker, 1)
          app.write_text(s, encoding='utf-8')

          # Rebuild Aircraft Adapter page into full-width tabbed views.
          html = Path('public/index.html')
          h = html.read_text(encoding='utf-8')
          start = h.index('        <section class="efb-page fenix-page" data-page="fenix" hidden>')
          end = h.index('        <section class="efb-page" data-page="automations" hidden>', start)
          replacement = '''        <section class="efb-page fenix-page" data-page="fenix" hidden>
          <header class="page-heading aircraft-page-heading"><div><small>AIRCRAFT-SPECIFIC CONNECTORS</small><h1>Aircraft & EFB</h1><p>Fenix Remote EFB and aircraft-specific adapters in one workspace.</p></div><span id="aircraft-adapter-status" class="module-status waiting">WAITING</span></header>
          <nav class="floating-section-nav aircraft-subnav" aria-label="Aircraft integration"><button type="button" class="active" data-aircraft-view-button="fenix">FENIX EFB</button><button type="button" data-aircraft-view-button="pmdg">PMDG</button><button type="button" data-aircraft-view-button="status">ADAPTER STATUS</button></nav>
          <div class="aircraft-view-stack">
            <section class="aircraft-view fenix-efb-view" data-aircraft-view="fenix">
              <article class="efb-card fenix-connect-strip"><div class="fenix-connect-main"><div><small>FENIX A319 / A320 / A321</small><h2>Fenix Remote EFB</h2><p id="fenix-detail">Load a Fenix A32X flight first. The official Remote EFB is then available on the PC.</p></div><span id="fenix-status-pill" class="module-status waiting">NOT CHECKED</span></div><div class="fenix-connect-actions"><div class="inline-form"><input id="fenix-url" inputmode="url" value="http://127.0.0.1:8083/" aria-label="Fenix Remote EFB URL"><button id="fenix-connect" class="primary-card-action" type="button">CONNECT</button></div><button id="fenix-embed" class="secondary-card-action" type="button" disabled>SHOW HERE</button><a id="fenix-open" class="secondary-card-action external-action" href="http://127.0.0.1:8083/" target="_blank" rel="noreferrer">OPEN SEPARATELY</a></div></article>
              <article class="efb-card fenix-frame-card fenix-frame-full"><div class="fenix-frame-placeholder" id="fenix-placeholder"><strong>FENIX REMOTE EFB</strong><span>Connect first, then display the official EFB here.</span></div><iframe id="fenix-frame" title="Fenix Remote EFB" sandbox="allow-forms allow-scripts allow-same-origin allow-popups" hidden></iframe></article>
            </section>
            <section class="aircraft-view" data-aircraft-view="pmdg" hidden><article class="efb-card pmdg-adapter-card"><div class="section-title"><div><small>LOCAL SDK DISCOVERY</small><h2>PMDG Adapter</h2></div><span id="pmdg-status-pill" class="module-status waiting">NOT DETECTED</span></div><p>Flight Deck liest ausschließlich den lokal installierten PMDG SDK-Header und erzeugt daraus die verfügbaren Event-IDs. SDK-Inhalte werden nicht mit Flight Deck ausgeliefert.</p><div class="bridge-facts"><span><small>FAMILY</small><b id="pmdg-family">—</b></span><span><small>SDK</small><b id="pmdg-sdk">—</b></span><span><small>DATA BROADCAST</small><b id="pmdg-broadcast">—</b></span><span><small>CONTROLS</small><b id="pmdg-controls">0</b></span></div><p class="safety-note">Controls are sent only after an explicit action and only when present in the locally installed SDK.</p></article></section>
            <section class="aircraft-view" data-aircraft-view="status" hidden><article class="efb-card adapter-overview-card"><div class="section-title"><div><small>ACTIVE ADAPTER</small><h2 id="aircraft-adapter-model">Generic SimConnect</h2></div><span id="aircraft-adapter-source">GENERIC</span></div><p id="aircraft-adapter-detail">Warte auf geladenes Flugzeug.</p><div class="bridge-facts"><span><small>CONTROLS</small><b id="aircraft-adapter-controls">0</b></span><span><small>SAFETY</small><b>EXPLICIT ONLY</b></span></div><button id="aircraft-adapter-refresh" class="primary-card-action" type="button">ADAPTER PRÜFEN</button></article></section>
          </div>
        </section>

'''
          h = h[:start] + replacement + h[end:]

          # Changelog in Update tab.
          update_anchor = '<article id="settings-updates" data-settings-panel="updates" class="efb-card settings-card update-card">'
          pos = h.index(update_anchor)
          close = h.index('</article>', pos) + len('</article>')
          changelog = '''
            <article data-settings-panel="updates" class="efb-card settings-card update-changelog-card"><div class="section-title"><div><small>WHAT'S NEW</small><h2>Changelog</h2></div><span>CURRENT v1.7.2</span></div><div class="update-changelog"><section><b>1.7.2</b><div><strong>UI, Taxi & Native EFB Builder</strong><ul><li>Taxi map follows the aircraft automatically when opened and after route updates.</li><li>Fenix EFB gets a full-width workspace with Fenix / PMDG / Adapter Status tabs.</li><li>Compact responsive card layout fixes oversized/empty Phase-2/3 boxes and text overflow.</li><li>Native MSFS EFB Package Builder state regression fixed.</li></ul></div></section><section><b>1.7.1</b><div><strong>Native EFB Package Builder</strong><p>Build and optionally install the native MSFS 2024 EFB Community package from the locally installed SDK.</p></div></section><section><b>1.7.0</b><div><strong>Native EFB & Flight Intelligence</strong><p>Route bridge, stabilized flight phases, Turnaround Coordinator and Flight Assistant.</p></div></section></div><small class="safety-note">When a new update is offered, Flight Deck will show its release version here before installation. Full release notes remain available on GitHub.</small></article>'''
          h = h[:close] + changelog + h[close:]
          html.write_text(h, encoding='utf-8')

          css = Path('public/styles.css')
          c = css.read_text(encoding='utf-8') + '''

/* 1.7.2 UI density / responsiveness */
.efb-pages .efb-card { min-width: 0; min-height: 0; height: auto; align-self: start; }
.ground-layout,.automation-layout,.settings-grid,.flight-page-layout,.briefing-layout,.atc-layout { align-items: start; grid-auto-rows: max-content; }
.section-title,.ground-brand,.fenix-connect-main { min-width: 0; }
.section-title > div,.ground-brand > div,.fenix-connect-main > div { min-width: 0; }
.section-title span,.section-title b,.bridge-facts b,.bridge-facts small,.integration-list small,.integration-list strong { overflow-wrap: anywhere; word-break: break-word; }
.bridge-facts { grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); }
.bridge-facts > span { min-width: 0; }
.turnaround-card,.ground-safety-card,.gsx-payload-card,.service-panel,.automation-master-card,.automation-variable-card,.automation-rule-builder,.automation-rules-card,.automation-log-card { height: auto !important; min-height: 0 !important; }
.aircraft-view-stack { display: block; }
.aircraft-view[hidden] { display: none !important; }
.aircraft-subnav { margin-bottom: 12px; }
.fenix-efb-view { display: grid; gap: 12px; grid-template-rows: auto minmax(520px, calc(100vh - 260px)); }
.fenix-connect-strip { display: grid; grid-template-columns: minmax(260px,1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; }
.fenix-connect-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.fenix-connect-main p { margin: 4px 0 0; }
.fenix-connect-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.fenix-connect-actions .inline-form { min-width: min(430px,100%); }
.fenix-frame-full { width: 100%; min-height: 520px !important; padding: 0; overflow: hidden; }
.fenix-frame-full iframe,.fenix-frame-full .fenix-frame-placeholder { width: 100%; height: 100%; min-height: 520px; }
.update-changelog { display: grid; gap: 0; margin-top: 6px; }
.update-changelog section { display: grid; grid-template-columns: 68px minmax(0,1fr); gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.update-changelog section:first-child { border-top: 0; }
.update-changelog section > b { font-size: 12px; letter-spacing: .05em; }
.update-changelog strong { display: block; margin-bottom: 4px; }
.update-changelog p,.update-changelog ul { margin: 0; color: var(--muted); line-height: 1.45; }
.update-changelog ul { padding-left: 18px; }
@media (max-width: 920px) {
  .fenix-connect-strip { grid-template-columns: 1fr; }
  .fenix-connect-actions { justify-content: flex-start; }
  .fenix-connect-actions .inline-form { min-width: 0; width: 100%; }
  .fenix-efb-view { grid-template-rows: auto minmax(440px,65vh); }
}
'''
          css.write_text(c, encoding='utf-8')

          # Add release notes to electron updater state for future dynamic use.
          electron = Path('src/electron-main.mjs')
          e = electron.read_text(encoding='utf-8')
          helper_anchor = 'function createUpdateService() {'
          helper = '''function normalizeReleaseNotes(value) {
            if (typeof value === 'string') return value.slice(0, 12000);
            if (Array.isArray(value)) return value.map((entry) => typeof entry === 'string' ? entry : entry?.note || '').filter(Boolean).join('\\n').slice(0, 12000);
            return '';
          }

'''
          if helper not in e: e = e.replace(helper_anchor, helper + helper_anchor, 1)
          e = e.replace("autoUpdater.on('update-available', (info) => set({ state: 'available', percent: 0, releaseName: info?.version || null, detail:", "autoUpdater.on('update-available', (info) => set({ state: 'available', percent: 0, releaseName: info?.version || null, releaseNotes: normalizeReleaseNotes(info?.releaseNotes), detail:", 1)
          e = e.replace("autoUpdater.on('update-downloaded', (info) => set({ state: 'downloaded', percent: 100, releaseName: info?.version || null, detail:", "autoUpdater.on('update-downloaded', (info) => set({ state: 'downloaded', percent: 100, releaseName: info?.version || null, releaseNotes: normalizeReleaseNotes(info?.releaseNotes), detail:", 1)
          electron.write_text(e, encoding='utf-8')

          # Update changelog top section with user's UI feedback fixes.
          ch = Path('CHANGELOG.md')
          x = ch.read_text(encoding='utf-8')
          needle = '## 1.7.2 — Native EFB Builder Hotfix\n\n'
          additions = '- Fixed Taxi Navigation auto-follow: opening Taxi and receiving a new route now keeps the aircraft centered; only the explicit ROUTE button disables Follow.\n- Reworked Aircraft & EFB into a full-width Fenix EFB workspace with Fenix / PMDG / Adapter Status sub-navigation.\n- Added compact responsive sizing/overflow rules for the new Phase-2/3 cards so empty state cards no longer stretch to oversized grid heights.\n- Added an in-app Updates changelog and preserved updater release notes in the Windows update state.\n'
          if additions not in x:
            if needle not in x: raise SystemExit('1.7.2 changelog missing')
            x = x.replace(needle, needle + additions, 1)
          ch.write_text(x, encoding='utf-8')
          PY
          npm install
      - name: Verify
        run: |
          node --check public/app.js
          node --check src/electron-main.mjs
          node --check src/msfs-efb-package-builder.mjs
          node scripts/verify-msfs-efb-builder.mjs
          grep -q "fitRoute({ disableFollow: false })" public/app.js
          grep -q 'data-aircraft-view-button="fenix"' public/index.html
          grep -q 'update-changelog-card' public/index.html
          grep -q 'normalizeReleaseNotes' src/electron-main.mjs
          grep -q 'fenix-frame-full' public/styles.css
          npm audit --audit-level=high
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+checkner89@users.noreply.github.com'
          git add public src CHANGELOG.md package-lock.json
          git commit -m 'Polish 1.7.2 UI taxi follow and update changelog'
          git push origin HEAD:hotfix-msfs-efb-builder-1.7.2
