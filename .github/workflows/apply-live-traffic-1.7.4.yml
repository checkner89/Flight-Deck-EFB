name: Apply Live Traffic 1.7.4

on:
  push:
    branches:
      - release/1.7.4-live-traffic
    paths:
      - '.github/workflows/apply-live-traffic-1.7.4.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: release/1.7.4-live-traffic
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Correct migration helpers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-live-traffic-1.7.4.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('data-page=\\"online\\"', 'data-page=\\"charts\\"')
          text = text.replace('data-page="online"', 'data-page="charts"')
          text = text.replace('new, count = re.subn(pattern, replacement, text, count=1, flags=flags)', 'new, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply 1.7.4 migration
        run: python scripts/apply-live-traffic-1.7.4.py

      - name: Synchronize package lock
        run: npm install

      - name: Syntax checks
        run: |
          node --check public/live-traffic.js
          node --check public/app.js
          node --check public/i18n.js
          node --check public/service-worker.js
          node --check src/simconnect-client.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/server.mjs

      - name: Live Traffic regression tests
        run: node scripts/test-live-traffic.mjs

      - name: Existing traffic merge regression
        run: |
          if [ -f scripts/test-traffic-merge.mjs ]; then node scripts/test-traffic-merge.mjs; fi

      - name: UI and honesty contract
        shell: bash
        run: |
          grep -q 'data-traffic-view="ground"' public/index.html
          grep -q 'data-traffic-view="arriving"' public/index.html
          grep -q 'data-traffic-view="nearby"' public/index.html
          ! grep -q 'data-traffic-view="departures"' public/index.html
          ! grep -q 'data-traffic-view="arrivals"' public/index.html
          ! grep -q 'TIME</span><span>FLIGHT</span><span>FROM</span><span>TO' public/index.html
          grep -q 'INFERRED' public/app.js
          grep -q 'REPORTED' public/app.js
          grep -q 'const TRAFFIC_RADIUS_METERS = 60_000;' src/simconnect-client.mjs
          grep -q 'const TRAFFIC_RADIUS_METERS = 60_000;' src/injected-traffic-client.mjs
          ! grep -q 'google.com/s2/favicons' public/app.js
          test "$(node -p "require('./package.json').version")" = '1.7.4'
          grep -q 'data-app-version="1.7.4"' public/index.html
          grep -q 'flight-deck-efb-v174' public/service-worker.js

      - name: Demo host smoke test
        shell: bash
        run: |
          node src/server.mjs --demo --port 8754 >/tmp/efb174.out 2>/tmp/efb174.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8754/ | grep -q 'Flight Deck EFB'; then
              echo '1.7.4 demo host passed.'
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/efb174.out || true
          cat /tmp/efb174.err || true
          exit 1

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md CHANGELOG.md public src scripts/test-live-traffic.mjs
          git commit -m 'Implement 1.7.4 honest Live Traffic'
          git push origin HEAD:release/1.7.4-live-traffic
