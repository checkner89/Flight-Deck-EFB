name: Publish Flight Deck EFB 1.4.1

on:
  push:
    branches:
      - main
    paths:
      - '.publish-141-trigger'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_SHA: 7f95b640e5b649017fae59b7eeb8e2c0e6c458fe
    steps:
      - name: Checkout clean 1.4.1 source
        uses: actions/checkout@v5
        with:
          ref: 7f95b640e5b649017fae59b7eeb8e2c0e6c458fe
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify release source
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.4.1') { throw "Expected 1.4.1, got $version" }
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check src/state-engine.mjs
          node --check src/taxi-route-planner.mjs
          node --check public/app.js
          node --check public/i18n.js
          node --input-type=module -e "import updaterPackage from 'electron-updater'; if (!('autoUpdater' in updaterPackage)) throw new Error('electron-updater autoUpdater export missing');"
          if (Test-Path 'src/navigraph-client.mjs') { throw 'Navigraph backend must remain disabled.' }
          if (!(Select-String -Path CHANGELOG.md -SimpleMatch '## 1.4.1 — 24 August 2026')) { throw '1.4.1 changelog entry missing.' }

      - name: Build OurAirports offline catalog
        run: npm run prepare-data

      - name: Verify bundled airport data
        shell: pwsh
        run: |
          if (!(Test-Path 'data/ourairports.min.json.gz')) { throw 'OurAirports offline catalog missing.' }
          $size = (Get-Item 'data/ourairports.min.json.gz').Length
          if ($size -lt 100000) { throw "OurAirports catalog unexpectedly small: $size bytes" }

      - name: Smoke test local EFB host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'efb141-release-host.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'efb141-release-host.err.log'
          $process = Start-Process -FilePath node -ArgumentList @('src/server.mjs', '--demo', '--port', '8745') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8745/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Flight Deck EFB') { $ready = $true }
              } catch {}
            } until ($ready -or (Get-Date) -gt $deadline)
            if (!$ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Release host smoke test failed.'
            }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/Flight Deck EFB.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable missing: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList @('--demo') -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged Flight Deck EFB exited during startup with code $($process.ExitCode)." }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Verify updater assets
        shell: pwsh
        run: |
          foreach ($file in @('dist/Flight-Deck-EFB-Setup-1.4.1.exe','dist/Flight-Deck-EFB-Setup-1.4.1.exe.blockmap','dist/latest.yml')) {
            if (!(Test-Path $file)) { throw "Missing release asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch 'version:\s*1\.4\.1') { throw 'latest.yml does not advertise 1.4.1.' }

      - name: Create 1.4.1 tag on validated source
        shell: pwsh
        run: |
          git fetch --tags --force
          $existing = git tag --list v1.4.1
          if ($existing -eq 'v1.4.1') {
            $tagged = git rev-list -n 1 v1.4.1
            if ($tagged -ne $env:RELEASE_SHA) { throw "v1.4.1 already points to unexpected commit $tagged" }
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.4.1 $env:RELEASE_SHA -m 'Flight Deck EFB 1.4.1'
            git push origin v1.4.1
          }

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $assets = @('dist/Flight-Deck-EFB-Setup-1.4.1.exe','dist/Flight-Deck-EFB-Setup-1.4.1.exe.blockmap','dist/latest.yml')
          gh release view v1.4.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.4.1 @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Uploading 1.4.1 release assets failed.' }
            gh release edit v1.4.1 --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --title 'Flight Deck EFB 1.4.1'
          } else {
            gh release create v1.4.1 @assets --repo $env:GITHUB_REPOSITORY --title 'Flight Deck EFB 1.4.1' --notes 'Flight Deck EFB 1.4.1. See CHANGELOG.md for the complete list of changes. Flight simulation use only — not for real-world navigation.' --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing 1.4.1 GitHub release failed.' }
          $release = gh release view v1.4.1 --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($release.tagName -ne 'v1.4.1' -or $release.isDraft -or $release.isPrerelease) { throw 'Published release metadata is invalid.' }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('Flight-Deck-EFB-Setup-1.4.1.exe','Flight-Deck-EFB-Setup-1.4.1.exe.blockmap','latest.yml')) {
            if ($name -notin $names) { throw "Published release is missing $name" }
          }

      - name: Write publish status
        if: ${{ always() }}
        shell: pwsh
        env:
          FINAL_STATUS: ${{ job.status }}
        run: |
          $payload = @{ status = $env:FINAL_STATUS; run_id = '${{ github.run_id }}'; release_sha = $env:RELEASE_SHA; version = '1.4.1'; finished_at = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json -Compress
          $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($payload))
          $statusInfo = $null
          try { $statusInfo = gh api "repos/$env:GITHUB_REPOSITORY/contents/.publish-141-status?ref=main" | ConvertFrom-Json } catch {}
          if ($statusInfo?.sha) {
            gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/.publish-141-status" -f message="Record 1.4.1 publish status" -f content="$base64" -f sha="$($statusInfo.sha)" -f branch="main"
          } else {
            gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/.publish-141-status" -f message="Record 1.4.1 publish status" -f content="$base64" -f branch="main"
          }
