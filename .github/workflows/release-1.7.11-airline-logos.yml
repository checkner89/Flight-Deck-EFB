name: Prepare 1.7.11 Airline Logos

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.7.11-airline-logos.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare 1.7.11 airline logos'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch pinned airline logo catalogs
        run: |
          git clone --quiet https://github.com/imgmongelli/airlines-logos-dataset.git "$RUNNER_TEMP/airlines-logos-dataset"
          git -C "$RUNNER_TEMP/airlines-logos-dataset" checkout --quiet 7b001fb8d5d0a2f875d57b2b5a8a8056b2fbc63a
          git clone --quiet https://github.com/spydogenesis/airlines-logo.git "$RUNNER_TEMP/airlines-logo-secondary"
          git -C "$RUNNER_TEMP/airlines-logo-secondary" checkout --quiet 8c5f1ae3d25538bd1b649a7ad85b902528c612b6

      - name: Apply 1.7.11 patch
        env:
          AIRLINE_SOURCE: ${{ runner.temp }}/airlines-logos-dataset
          AIRLINE_SOURCE_2: ${{ runner.temp }}/airlines-logo-secondary
        run: |
          python scripts/apply-1.7.11.py
          python <<'PY'
          from pathlib import Path
          p = Path('public/airline-catalog.js')
          text = p.read_text(encoding='utf-8')
          old = "if (/^[A-Z0-9]{2,3}\\d/.test(rawFlight)) return rawFlight;"
          new = "if (/^[A-Z0-9]{2,3}\\d/.test(rawFlight) && /[A-Z]/.test(rawFlight.slice(0, 3))) return rawFlight;"
          if old not in text:
              raise SystemExit('flight-number prefix patch target missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          npm version 1.7.11 --no-git-tag-version

      - name: Verify 1.7.11 source
        run: |
          node --check public/app.js
          node --check public/airline-catalog.js
          node --check src/server.mjs
          node --check public/live-traffic.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { airlineCatalogStats, formatTrafficFlightNumber, resolveAirlineIdentity } from './public/airline-catalog.js';
          const stats = airlineCatalogStats();
          assert.ok(stats.records >= 1500, `expected >=1500 records, got ${stats.records}`);
          assert.equal(stats.logos, stats.records, 'every airline/operator record must have a local icon');
          assert.ok(stats.officialLogos >= 900, `expected >=900 supplied logos, got ${stats.officialLogos}`);
          const lufthansa = resolveAirlineIdentity({ callsign: 'DLH123' });
          assert.equal(lufthansa.icao, 'DLH');
          assert.equal(lufthansa.iata, 'LH');
          assert.ok(lufthansa.logo.includes('/assets/airlines/'));
          assert.equal(formatTrafficFlightNumber({ callsign: 'DLH123' }, lufthansa), 'LH123');
          const sunexpress = resolveAirlineIdentity({ title: 'AIGAM SunExpress Boeing 737-800', airline: 'SunExpress', flightNumber: '456' });
          assert.equal(sunexpress.icao, 'SXS');
          assert.equal(sunexpress.iata, 'XQ');
          assert.ok(sunexpress.logo.includes('/assets/airlines/'));
          assert.equal(formatTrafficFlightNumber({ flightNumber: '456' }, sunexpress), 'XQ456');
          const british = resolveAirlineIdentity({ callsign: 'BAW947' });
          assert.equal(british.iata, 'BA');
          assert.equal(formatTrafficFlightNumber({ callsign: 'BAW947' }, british), 'BA947');
          console.log('Airline catalog regression OK', stats);
          NODE
          test -f public/assets/airlines/DLH.png
          test -f public/assets/airlines/SXS.png
          test -f public/assets/airlines/EWG.png
          test -f public/assets/airlines/BAW.png
          grep -q 'airline-catalog.js?v=1.7.11' public/app.js
          grep -q "'/airline-catalog.js?v=1.7.11'" public/service-worker.js
          grep -q 'Complete Airline Icons' CHANGELOG.md
          node -e "const p=require('./package.json'); if(p.version!=='1.7.11') throw new Error('wrong version')"

      - name: Commit release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-1.7.11-airline-logos.yml
          git rm scripts/apply-1.7.11.py
          git add -A
          git commit -m 'Release 1.7.11 Complete Airline Icons'
          git push origin HEAD:main
