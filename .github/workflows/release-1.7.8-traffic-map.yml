name: Prepare 1.7.8 Traffic Map Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.7.8-traffic-map.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare 1.7.8 traffic map release'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply 1.7.8 changes
        run: |
          python scripts/apply-1.7.8.py
          npm version 1.7.8 --no-git-tag-version
      - name: Verify 1.7.8 source
        run: |
          npm install
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/airport-map-service.mjs
          node --check src/msfs-airport-facility.mjs
          node --check public/live-traffic.js
          node --check public/app.js
          node scripts/test-live-traffic.mjs
          node scripts/verify-traffic-merge.mjs
          node scripts/verify-installer-legal.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildOverpassQuery, convertOverpassPayload } from './src/airport-map-service.mjs';
          import { mergeMsfsFacilityMap } from './src/msfs-airport-facility.mjs';
          const query = buildOverpassQuery({ icao: 'EDDL', lat: 51.2895, lon: 6.7668 });
          assert.match(query, /flightDeckAirportArea/);
          assert.match(query, /\["building"\]/);
          const converted = convertOverpassPayload({ elements: [{ type: 'way', id: 1, tags: { building: 'yes', name: 'Airport Building' }, geometry: [
            { lat: 51.28, lon: 6.76 }, { lat: 51.281, lon: 6.76 }, { lat: 51.281, lon: 6.761 }, { lat: 51.28, lon: 6.76 },
          ] }] }, { icao: 'EDDL', lat: 51.2895, lon: 6.7668 });
          assert.equal(converted.features[0]?.kind, 'building');
          const base = { schemaVersion: 4, icao: 'EDDL', center: { lat: 51.28, lon: 6.76 }, bounds: [[51.2, 6.7], [51.3, 6.8]], features: [{ id: 'osm/twy', kind: 'taxiway', geometry: 'line', coordinates: [[51.28, 6.76], [51.281, 6.761]] }] };
          const facility = { schemaVersion: 4, icao: 'EDDL', center: base.center, bounds: base.bounds, features: [{ id: 'msfs/stand', kind: 'parking_position', geometry: 'point', coordinates: [[51.28, 6.76]] }], facility: {} };
          const merged = mergeMsfsFacilityMap(base, facility);
          assert.ok(merged.features.some((entry) => entry.id === 'osm/twy'), 'OSM taxiway must survive when facility has no taxiways');
          console.log('Airport map regression OK');
          NODE
          node -e "const p=require('./package.json'); if(p.version!=='1.7.8') throw new Error('version'); if(p.author!=='Christoph Heckner') throw new Error('author');"
          if grep -q 'class="home-assistant-card efb-card"' public/index.html; then echo 'Flight Assistant card still present' >&2; exit 1; fi
      - name: Commit release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-1.7.8-traffic-map.yml
          git rm scripts/apply-1.7.8.py
          git add -A
          git commit -m 'Release 1.7.8 Traffic Identity and Complete Taxi Map'
          git push origin HEAD:main
