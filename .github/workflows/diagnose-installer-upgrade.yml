name: Validate 1.24.11 Windows Startup Recovery

on:
  push:
    branches:
      - 'fix/1.24.11-installer-repair'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-recovery:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and materialize 1.24.11
        run: npm install

      - name: Verify 1.24.11 source regression
        run: node scripts/test-release-1.24.11.mjs

      - name: Build airport catalog
        run: npm run prepare-data

      - name: Build 1.24.11 Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Download released 1.24.10 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\previous" | Out-Null
          gh release download v1.24.10 --repo '${{ github.repository }}' --pattern 'FLYXORA-Setup-1.24.10.exe' --dir "$env:RUNNER_TEMP\previous"

      - name: Install released 1.24.10 as upgrade baseline
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\previous\FLYXORA-Setup-1.24.10.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "1.24.10 installer exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter 'FLYXORA.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw '1.24.10 reported success but FLYXORA.exe was not installed.' }
          Write-Host "1.24.10 baseline installed at $($exe.FullName)"

      - name: Repair-upgrade 1.24.10 to 1.24.11
        shell: pwsh
        run: |
          Get-Process -Name FLYXORA -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.24.11') { throw "Expected 1.24.11, got $version" }
          $setup = Join-Path $PWD "dist\FLYXORA-Setup-$version.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "1.24.11 installer exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Filter 'FLYXORA.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw '1.24.11 reported success but FLYXORA.exe is not installed.' }
          "FLYXORA_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "1.24.11 installed at $($exe.FullName)"

      - name: Launch installed 1.24.11 in real mode and require visible window
        shell: pwsh
        run: |
          $debugPort = 9446
          $proc = Start-Process -FilePath $env:FLYXORA_EXE -ArgumentList @("--remote-debugging-port=$debugPort") -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            $visible = $false
            do {
              Start-Sleep -Milliseconds 500
              $proc.Refresh()
              if ($proc.HasExited) { throw "Installed FLYXORA exited with code $($proc.ExitCode)." }
              $windows = Get-Process -Name FLYXORA -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 }
              if ($windows) { $visible = $true; break }
            } until ((Get-Date) -gt $deadline)
            if (!$visible) {
              Get-Process -Name FLYXORA -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,MainWindowHandle,MainWindowTitle | Format-Table | Out-String | Write-Host
              throw 'FLYXORA stayed in background without any visible top-level window.'
            }
            $targets = Invoke-RestMethod -Uri "http://127.0.0.1:$debugPort/json" -TimeoutSec 5
            $targets | Select-Object type,title,url | Format-Table | Out-String | Write-Host
            Write-Host 'Installed 1.24.11 real-mode launch exposes a visible FLYXORA window.'
          } finally {
            Get-Process -Name FLYXORA -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Verify installed registry version
        shell: pwsh
        run: |
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
            Where-Object { $_.DisplayName -eq 'FLYXORA' } |
            Select-Object -First 1
          if (!$entry) { throw 'FLYXORA uninstall registry entry is missing.' }
          if ($entry.DisplayVersion -ne '1.24.11') { throw "Registry still reports $($entry.DisplayVersion)" }
          $entry | Select-Object DisplayName,DisplayVersion,UninstallString,QuietUninstallString | Format-List | Out-String | Write-Host
