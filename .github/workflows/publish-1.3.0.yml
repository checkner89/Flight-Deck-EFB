name: Publish Flight Deck EFB 1.3.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-1.3.0.yml'

permissions:
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.3.0"
          test ! -f src/navigraph-client.mjs
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check public/app.js

      - name: Create v1.3.0 tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.3.0 >/dev/null; then
            echo 'Tag v1.3.0 already exists; nothing to do.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.3.0 -m 'Flight Deck EFB 1.3.0'
          git push origin v1.3.0
