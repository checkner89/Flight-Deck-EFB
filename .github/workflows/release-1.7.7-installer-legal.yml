name: Prepare 1.7.7 Installer Legal Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.7.7-installer-legal.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare release source
        run: |
          python scripts/prepare-1.7.7-release.py
          npm version 1.7.7 --no-git-tag-version
      - name: Verify installer legal contract
        run: |
          npm install
          node scripts/verify-installer-legal.mjs
          node --check src/server.mjs
          node --check public/app.js
          node scripts/test-live-traffic.mjs
          node -e "const p=require('./package.json'); if(p.version!=='1.7.7') process.exit(1); if(p.author!=='Christoph Heckner') process.exit(2); if(!p.build.copyright.includes('Christoph Heckner')) process.exit(3); if(p.build.nsis.license!=='build/license.txt') process.exit(4);"
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-1.7.7-installer-legal.yml
          git rm scripts/prepare-1.7.7-release.py
          git add -A
          git commit -m 'Release 1.7.7 Installer and Legal Transparency'
          git push origin HEAD:main
