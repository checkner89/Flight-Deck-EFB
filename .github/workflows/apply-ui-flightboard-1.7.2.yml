name: Apply UI Flightboard 1.7.2

on:
  push:
    branches:
      - hotfix-msfs-efb-builder-1.7.2
    paths:
      - '.github/workflows/apply-ui-flightboard-1.7.2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix-msfs-efb-builder-1.7.2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply patch
        run: python scripts/patch-flightboard-ui-1.7.2.py
      - name: Install dependencies
        run: npm install
      - name: Verify JavaScript
        run: |
          node --check public/app.js
          node --check public/i18n.js
          node --check src/electron-main.mjs
          node --check src/injected-traffic-client.mjs
          node --check src/msfs-efb-package-builder.mjs
          node scripts/verify-msfs-efb-builder.mjs
      - name: Verify UI contracts
        run: |
          grep -q 'fitRoute({ disableFollow: false })' public/app.js
          grep -q 'data-aircraft-view-button="fenix"' public/index.html
          grep -q 'update-changelog-card' public/index.html
          grep -q 'traffic-airline-logo' public/styles.css
          grep -q 'AI TRAFFIC FROMAIRPORT' src/injected-traffic-client.mjs
          grep -q 'Enroute' public/i18n.js
          grep -q 'Parking' public/i18n.js
          npm audit --audit-level=high
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+checkner89@users.noreply.github.com'
          git add public src CHANGELOG.md package-lock.json
          git commit -m 'Fix 1.7.2 UI taxi SI and Flightboard'
          git push origin HEAD:hotfix-msfs-efb-builder-1.7.2
