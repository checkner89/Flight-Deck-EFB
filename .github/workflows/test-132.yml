name: Test 1.3.2 Windows Build

on:
  push:
    branches:
      - fix/1.3.2-simconnect-ui

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Apply verified 1.3.2 fixes
        run: node scripts/apply-1.3.2-fixes.mjs
      - name: Verify source
        shell: pwsh
        run: |
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check src/state-engine.mjs
          node --check public/app.js
          node --check public/i18n.js
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.3.2') { throw "Expected 1.3.2, got $version" }
          if (Test-Path 'src/navigraph-client.mjs') { throw 'Navigraph backend must remain disabled.' }
      - name: Build OurAirports offline catalog
        run: npm run prepare-data
      - name: Smoke test local EFB host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'efb-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'efb-smoke.err.log'
          $process = Start-Process -FilePath node -ArgumentList @('src/server.mjs', '--demo', '--port', '8745') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(25)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8745/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Flight Deck EFB') { $ready = $true }
              } catch {}
            } until ($ready -or (Get-Date) -gt $deadline)
            if (!$ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Local EFB host smoke test failed.'
            }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Build Windows installer
        run: npm run dist
      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/Flight Deck EFB.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable missing: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList @('--demo') -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged app exited with code $($process.ExitCode)." }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Verify updater assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          foreach ($file in @("dist/Flight-Deck-EFB-Setup-$version.exe", "dist/Flight-Deck-EFB-Setup-$version.exe.blockmap", 'dist/latest.yml')) {
            if (!(Test-Path $file)) { throw "Missing asset: $file" }
          }
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-EFB-1.3.2-Test
          path: |
            dist/Flight-Deck-EFB-Setup-1.3.2.exe
            dist/Flight-Deck-EFB-Setup-1.3.2.exe.blockmap
            dist/latest.yml
