name: Finalize Phase 2 1.6.0

on:
  push:
    branches:
      - phase2-aircraft-ground-1.6.0
    paths:
      - '.github/workflows/apply-phase2-1.6.0.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2 branch
        uses: actions/checkout@v5
        with:
          ref: phase2-aircraft-ground-1.6.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply final safeguards and documentation
        run: |
          python scripts/finalize-phase2.py
          python scripts/fix-phase2-ui.py

      - name: Install dependencies
        run: npm install

      - name: Verify Phase 2 runtime and UI contracts
        shell: bash
        run: |
          node --check src/aircraft-adapter-manager.mjs
          node --check src/ground-safety-engine.mjs
          node --check src/gsx-client.mjs
          node --check src/simconnect-client.mjs
          node --check src/server.mjs
          node --check src/state-engine.mjs
          node --check public/app.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { parsePmdgSdkHeader } from './src/aircraft-adapter-manager.mjs';
          import { evaluateGroundSafety } from './src/ground-safety-engine.mjs';

          const html = fs.readFileSync('public/index.html', 'utf8');
          const app = fs.readFileSync('public/app.js', 'utf8');
          for (const id of [
            'aircraft-adapter-status','aircraft-adapter-model','aircraft-adapter-source','aircraft-adapter-detail','aircraft-adapter-controls','aircraft-adapter-refresh',
            'pmdg-status-pill','pmdg-family','pmdg-sdk','pmdg-broadcast','pmdg-controls',
            'ground-safety-status','ground-safety-detail','ground-safety-list',
            'gsx-payload-status','gsx-pax-target','gsx-pax-progress','gsx-cargo-progress','gsx-payload-sync','gsx-payload-message',
            'settings-adapter-dot','settings-adapter'
          ]) {
            assert.ok(html.includes(`id="${id}"`), `HTML id missing: ${id}`);
            assert.ok(app.includes(`$('#${id}')`), `app element binding missing: ${id}`);
          }

          const sdk = parsePmdgSdkHeader('#define THIRD_PARTY_EVENT_ID_MIN 0x11000\n#define EVT_TEST (THIRD_PARTY_EVENT_ID_MIN + 900)', { family: 'PMDG Test' });
          assert.equal(sdk.controls[0].eventNumber, 70532);
          const safety = evaluateGroundSafety({
            aircraft:{lat:50,lon:8,onGround:true,groundSpeed:31},
            flight:{clearedForTakeoff:false},
            taxi:{clearance:{text:'Taxi via A'},holdShorts:[]},
            guidance:{available:true,warning:false,remainingMeters:300},
            integrations:{flightOperations:{phaseOverride:'taxi-out'},simTraffic:{aircraft:[]}}
          });
          assert.equal(safety.alerts[0].severity, 'critical');
          console.log('Phase 2 contracts OK');
          NODE

      - name: Verify documentation and release text
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = '1.6.0'
          grep -q 'Effective for version 1.6.0' PRIVACY.md
          grep -q 'Third-party notices — Flight Deck EFB 1.6.0' THIRD_PARTY_NOTICES.md
          grep -q -- '--notes-file $notesFile' .github/workflows/release.yml
          grep -q 'PMDG_PACKAGES_DIR' public/index.html
          ! grep -q 'SayIntentions operations update' .github/workflows/release.yml
          ! grep -R -nE 'Setup-1\.2\.0|FLIGHT_DECK_UPDATE_URL|Flight Deck EFB 1\.4\.1|v1\.4\.4|NAVIGRAPH_CLIENT_SECRET' README.md PRIVACY.md THIRD_PARTY_NOTICES.md public/index.html .github/workflows/release.yml

      - name: Smoke test demo host
        shell: bash
        run: |
          node src/server.mjs --demo --port 8747 >/tmp/efb-final.out 2>/tmp/efb-final.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8747/ | grep -q 'Flight Deck EFB'; then
              echo 'Final Phase 2 demo host passed.'
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/efb-final.out || true
          cat /tmp/efb-final.err || true
          exit 1

      - name: Commit final Phase 2 docs and safeguards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/aircraft-adapter-manager.mjs PRIVACY.md THIRD_PARTY_NOTICES.md public/index.html
          git commit -m 'Finalize Phase 2 adapter safeguards and documentation'
          git push origin HEAD:phase2-aircraft-ground-1.6.0
