name: Test 1.4.1 Windows Build

on:
  push:
    branches:
      - feature/1.4.0-rc2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Apply 1.4.1 migration
        shell: pwsh
        run: |
          node scripts/apply-140-a.mjs
          node scripts/apply-140-b1.mjs
          node scripts/apply-140-b2.mjs
          node scripts/apply-140-c1a.mjs
          node scripts/apply-140-c1b.mjs
          node scripts/apply-140-c2.mjs
          node scripts/apply-140-rc2.mjs
          node scripts/apply-140-rc2b.mjs
          node scripts/apply-141-version.mjs

      - name: Verify source and UX contract
        shell: pwsh
        run: |
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check src/state-engine.mjs
          node --check src/taxi-route-planner.mjs
          node --check public/app.js
          node --check public/i18n.js
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.4.1') { throw "Expected 1.4.1, got $version" }
          if (Test-Path 'src/navigraph-client.mjs') { throw 'Navigraph backend must remain disabled.' }
          $html = Get-Content public/index.html -Raw
          $app = Get-Content public/app.js -Raw
          $server = Get-Content src/server.mjs -Raw
          $state = Get-Content src/state-engine.mjs -Raw
          foreach ($required in @('home-greeting','home-simbrief-import','floating-section-nav','update-dialog','planner-holding-point','com-next-station','show-help-texts','data-settings-tab','data-atc-tab','data-flight-hub-tab')) {
            if ($html -notmatch [regex]::Escape($required)) { throw "Missing UI contract: $required" }
          }
          if ($html -match 'onboarding-profile') { throw 'Pilot profile is still present in onboarding.' }
          if ($html -match 'efb-app-tile tracking-app') { throw 'Separate Flight Tracking home tile is still present.' }
          if ($html -match 'provider-selector') { throw 'Selectable ATC provider UI must be removed.' }
          if ($server -notmatch '/api/update/download') { throw 'Update download endpoint missing.' }
          foreach ($required in @('renderTrackingTraffic','nextComSuggestion','importSimBriefFromHome','showHelpTexts','checkForUpdate','trafficRouteFields','homeGateLabel','ensureAutomaticAtcProvider','setSettingsTab','setAtcTab','setFlightHubTab')) {
            if ($app -notmatch [regex]::Escape($required)) { throw "Missing application behavior: $required" }
          }
          if ($app -notmatch "trafficBoardView === 'all' \|\| !airport \? all : airportTraffic") { throw 'Flightboard ALL does not use all nearby traffic.' }
          if ($state -notmatch 'guidanceSegmentIndex') { throw 'Progressive taxi guidance state missing.' }
          if ($state -notmatch 'minSegment = 0, maxSegment = null') { throw 'Segment-window taxi guidance missing.' }

      - name: Build OurAirports offline catalog
        run: npm run prepare-data

      - name: Verify bundled airport data
        shell: pwsh
        run: |
          if (!(Test-Path 'data/ourairports.min.json.gz')) { throw 'OurAirports offline catalog missing.' }
          $size = (Get-Item 'data/ourairports.min.json.gz').Length
          if ($size -lt 100000) { throw "OurAirports catalog unexpectedly small: $size bytes" }

      - name: Smoke test local EFB host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'efb141-host.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'efb141-host.err.log'
          $process = Start-Process -FilePath node -ArgumentList @('src/server.mjs', '--demo', '--port', '8745') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(30)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8745/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Flight Deck EFB') { $ready = $true }
              } catch {}
            } until ($ready -or (Get-Date) -gt $deadline)
            if (!$ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Local EFB host smoke test failed.'
            }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/Flight Deck EFB.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable missing: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList @('--demo') -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Packaged Flight Deck EFB exited during startup with code $($process.ExitCode)." }
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Verify updater assets
        shell: pwsh
        run: |
          foreach ($file in @('dist/Flight-Deck-EFB-Setup-1.4.1.exe','dist/Flight-Deck-EFB-Setup-1.4.1.exe.blockmap','dist/latest.yml')) {
            if (!(Test-Path $file)) { throw "Missing updater asset: $file" }
          }
          $latest = Get-Content dist/latest.yml -Raw
          if ($latest -notmatch 'version:\s*1\.4\.1') { throw 'latest.yml does not advertise 1.4.1.' }

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-EFB-1.4.1-RC-Test
          path: |
            dist/Flight-Deck-EFB-Setup-1.4.1.exe
            dist/Flight-Deck-EFB-Setup-1.4.1.exe.blockmap
            dist/latest.yml

      - name: Commit validated materialized source to release branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release/1.4.1-materialized' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public src README.md PRIVACY.md THIRD_PARTY_NOTICES.md CHANGELOG.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Materialized source already committed.'
          } else {
            git commit -m "Materialize Flight Deck EFB 1.4.1 source"
            $materialized = git rev-parse HEAD
            git fetch origin "$env:GITHUB_HEAD_REF"
            git checkout -B materialized-branch "origin/$env:GITHUB_HEAD_REF"
            git cherry-pick $materialized
            if ($LASTEXITCODE -ne 0) { throw 'Could not rebase materialized source onto current release branch.' }
            git push origin "HEAD:$env:GITHUB_HEAD_REF"
            if ($LASTEXITCODE -ne 0) { throw 'Could not push materialized source to release branch.' }
          }
