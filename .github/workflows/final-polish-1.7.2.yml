name: Final Polish 1.7.2

on:
  push:
    branches:
      - hotfix-msfs-efb-builder-1.7.2
    paths:
      - '.github/workflows/final-polish-1.7.2.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix-msfs-efb-builder-1.7.2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply final polish
        run: python scripts/final-polish-1.7.2.py
      - name: Install dependencies
        run: npm install
      - name: Verify
        run: |
          node --check public/app.js
          node --check public/i18n.js
          node --check src/injected-traffic-client.mjs
          node --check src/electron-main.mjs
          grep -q "departures: 'DEPARTURES'" public/i18n.js
          grep -q "trafficEnroute: 'ENROUTE'" public/i18n.js
          grep -q 'trafficRouteFields(entry, airport)' public/app.js
          grep -q '1.7.2 SI alignment' public/styles.css
          npm audit --audit-level=high
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+checkner89@users.noreply.github.com'
          git add public CHANGELOG.md package-lock.json
          git commit -m 'Finalize 1.7.2 Flightboard and SI alignment'
          git push origin HEAD:hotfix-msfs-efb-builder-1.7.2
