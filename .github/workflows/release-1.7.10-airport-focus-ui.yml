name: Prepare 1.7.10 Airport Focus UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.7.10-airport-focus-ui.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare 1.7.10 airport focus ui'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply 1.7.10 patch
        run: |
          python scripts/apply-1.7.10.py
          npm version 1.7.10 --no-git-tag-version
      - name: Verify 1.7.10 source
        run: |
          npm install
          node --check public/app.js
          node --check src/server.mjs
          grep -q 'id="airport-focus-button"' public/index.html
          grep -q 'airportFocusMask' public/app.js
          grep -q 'flight-deck-airport-focus' public/app.js
          grep -q 'Airport Focus' CHANGELOG.md
          grep -q 'app.js?v=1.7.10' public/index.html
          grep -q 'service-worker.js?v=1.7.10' public/app.js
          node -e "const p=require('./package.json'); if(p.version!=='1.7.10') throw new Error('version'); if(p.author!=='Christoph Heckner') throw new Error('author');"
      - name: Commit release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-1.7.10-airport-focus-ui.yml
          git rm scripts/apply-1.7.10.py
          git add -A
          git commit -m 'Release 1.7.10 Airport Focus and Taxi Readability'
          git push origin HEAD:main
