name: Validate Flight Deck 1.23

on:
  push:
    branches:
      - 'feature/1.23-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies and materialize release
        run: npm install

      - name: Verify 1.23 JavaScript syntax
        shell: pwsh
        run: |
          node --check src/electron-bootstrap.mjs
          node --check src/flight-journey-engine.mjs
          node --check src/flight-journey-service.mjs
          node --check src/briefing-readiness-engine.mjs
          node --check src/briefing-readiness-service.mjs
          node --check scripts/prepare-release-1.23.0-compat.mjs
          node --check scripts/apply-feature-1.23-flight-journey.mjs
          node --check scripts/apply-feature-1.23-briefing-readiness.mjs
          node --check scripts/apply-release-1.23.0.mjs
          node --check scripts/test-single-instance-bootstrap.mjs
          node --check scripts/test-flight-journey-engine.mjs
          node --check scripts/test-flight-journey-service.mjs
          node --check scripts/test-briefing-readiness-engine.mjs
          node --check scripts/test-release-1.23.0.mjs

      - name: Run focused 1.23 regressions
        run: |
          node scripts/test-single-instance-bootstrap.mjs
          node scripts/test-flight-journey-engine.mjs
          node scripts/test-flight-journey-service.mjs
          node scripts/test-briefing-readiness-engine.mjs
          node scripts/test-release-1.23.0.mjs

      - name: Verify live 1.23 materialization
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $server = Get-Content 'src/server.mjs' -Raw
          $state = Get-Content 'src/state-engine.mjs' -Raw
          $recorder = Get-Content 'src/flight-recorder.mjs' -Raw
          $html = Get-Content 'public/index.html' -Raw
          if ($version -ne '1.23.0') { throw "Unexpected release version: $version" }
          if ($server -notmatch "const APP_VERSION = '1\.23\.0';") { throw 'Server version was not materialized to 1.23.0.' }
          if ($html -notmatch 'data-app-version="1\.23\.0"') { throw 'HTML version was not materialized to 1.23.0.' }
          if ($server -notmatch 'FlightJourneyService' -or $server -notmatch 'flightJourney\.start\(\)') { throw 'Flight Journey service is not wired into the live server.' }
          if ($server -notmatch 'BriefingReadinessService' -or $server -notmatch 'briefingReadiness\.start\(\)') { throw 'Briefing Readiness service is not wired into the live server.' }
          if ($state -notmatch "'planning'.*'boarding'.*'pushback'" -or $state -notmatch 'flightJourney: \{') { throw 'Flight Journey state and manual phases are not materialized.' }
          if ($state -notmatch 'briefingReadiness: \{') { throw 'Briefing Readiness state is not materialized.' }
          if ($recorder -notmatch "journeyCompletion" -or $recorder -notmatch "journey-complete-at-gate" -or $recorder -notmatch "stable-parked-after-flight") { throw 'Journey-driven recorder completion or safe legacy fallback is missing.' }

      - name: Run stable pilot regressions
        run: |
          node scripts/test-pilot-tools.mjs
          node scripts/test-release-1.21.0.mjs
          node scripts/test-release-1.22.0.mjs
          node scripts/test-release-1.22.1.mjs
          node scripts/test-release-1.23.0.mjs
