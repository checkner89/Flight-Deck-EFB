name: Reliability validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: node scripts/test-reliability.mjs
      - run: node scripts/test-live-traffic.mjs
      - run: npm run test:ops
