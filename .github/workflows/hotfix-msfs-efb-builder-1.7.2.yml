name: Verify MSFS EFB Builder 1.7.2 Hotfix

on:
  push:
    branches:
      - hotfix-msfs-efb-builder-1.7.2
    paths:
      - '.github/workflows/hotfix-msfs-efb-builder-1.7.2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hotfix-msfs-efb-builder-1.7.2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          builder = Path('src/msfs-efb-package-builder.mjs')
          text = builder.read_text(encoding='utf-8')
          old = "    const detected = await this.detect();\n    if (!detected.canBuild || !detected.sdk?.ready)"
          new = "    await this.detect();\n    const detected = this.current;\n    if (!detected.canBuild || !detected.sdk?.ready)"
          if old not in text:
              raise SystemExit('Expected builder detection sequence not found')
          builder.write_text(text.replace(old, new, 1), encoding='utf-8')

          version_files = [
              'README.md', 'PRIVACY.md', 'THIRD_PARTY_NOTICES.md',
              'MSFS-2024-EFB-App/README.md', 'public/index.html',
              'public/app.js', 'public/service-worker.js', 'src/server.mjs'
          ]
          for name in version_files:
              p = Path(name)
              value = p.read_text(encoding='utf-8').replace('1.7.1', '1.7.2')
              value = value.replace('flight-deck-efb-v171', 'flight-deck-efb-v172')
              p.write_text(value, encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['version'] = '1.7.2'
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          value = changelog.read_text(encoding='utf-8')
          marker = '# Flight Deck EFB changelog\n\n'
          section = '''## 1.7.2 — Native EFB Builder Hotfix\n\n- Fixed a critical builder-state regression where **Build Package** / **Build & Install** could report the SDK as unavailable immediately after successful detection.\n- Added a regression check that verifies the build path uses the trusted internal detected SDK state rather than the sanitized public status object.\n- No changes to the Phase-3 route bridge, Flight Intelligence, Turnaround Coordinator or Flight Assistant behavior.\n\n'''
          if '## 1.7.2 — Native EFB Builder Hotfix' not in value:
              if marker not in value:
                  raise SystemExit('CHANGELOG marker missing')
              value = value.replace(marker, marker + section, 1)
          changelog.write_text(value, encoding='utf-8')

          verify = Path('scripts/verify-msfs-efb-builder.mjs')
          value = verify.read_text(encoding='utf-8')
          value = value.replace("  transformTemplateText,\n", "  transformTemplateText,\n  MsfsEfbPackageBuilder,\n")
          regression = '''\nconst builder = new MsfsEfbPackageBuilder(null, { platform: 'win32' });\nbuilder.current = { ...builder.current, canBuild: true, sdk: { ready: true }, communityDirectory: null };\nbuilder.detect = async () => builder.publicStatus();\nawait assert.rejects(\n  () => builder.build(),\n  /Builder storage directory is unavailable/,\n  'build() must use the trusted internal detected state after detect()',\n);\n'''
          if 'trusted internal detected state' not in value:
              value = value.replace("\nconsole.log('MSFS EFB builder contract OK');\n", regression + "\nconsole.log('MSFS EFB builder contract OK');\n")
          verify.write_text(value, encoding='utf-8')
          PY
          npm install
      - name: Verify hotfix behavior
        run: |
          node --check src/msfs-efb-package-builder.mjs
          node --check src/server.mjs
          node --check public/app.js
          node scripts/verify-msfs-efb-builder.mjs
          test "$(node -p "require('./package.json').version")" = '1.7.2'
          grep -q "const detected = this.current" src/msfs-efb-package-builder.mjs
          grep -q 'flight-deck-efb-v172' public/service-worker.js
          npm audit --audit-level=high
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md PRIVACY.md THIRD_PARTY_NOTICES.md package.json package-lock.json public src scripts MSFS-2024-EFB-App
          git commit -m 'Fix MSFS EFB builder detected state and bump 1.7.2'
          git push origin HEAD:hotfix-msfs-efb-builder-1.7.2
