name: Materialize 1.4.1 Release Branch

on:
  push:
    branches:
      - release/1.4.1-materialized
    paths:
      - '.release-141-branch-trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/1.4.1-materialized
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply validated migration
        run: |
          node scripts/apply-140-a.mjs
          node scripts/apply-140-b1.mjs
          node scripts/apply-140-b2.mjs
          node scripts/apply-140-c1a.mjs
          node scripts/apply-140-c1b.mjs
          node scripts/apply-140-c2.mjs
          node scripts/apply-140-rc2.mjs
          node scripts/apply-140-rc2b.mjs
          node scripts/apply-141-version.mjs

      - name: Verify materialized source
        run: |
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check src/state-engine.mjs
          node --check src/taxi-route-planner.mjs
          node --check public/app.js
          node --check public/i18n.js
          test "$(node -p "require('./package.json').version")" = "1.4.1"
          grep -q "const APP_VERSION = '1.4.1'" src/server.mjs
          grep -q "## 1.4.1 — 24 August 2026" CHANGELOG.md
          test ! -f src/navigraph-client.mjs

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public src README.md PRIVACY.md THIRD_PARTY_NOTICES.md CHANGELOG.md
          git commit -m "Materialize Flight Deck EFB 1.4.1 source"
          git push origin HEAD:release/1.4.1-materialized
