name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version as a GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
      - feature/full-efb-shell
    paths-ignore:
      - 'build-status/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify restored application source
        shell: pwsh
        run: |
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check public/app.js
          node --check public/i18n.js
          if (Test-Path 'src/navigraph-client.mjs') {
            throw 'Navigraph client must remain disabled in this build.'
          }
          $version = node -p "require('./package.json').version"
          Write-Host "Building Flight Deck EFB $version"

      - name: Build OurAirports offline catalog
        run: npm run prepare-data

      - name: Verify bundled airport data
        shell: pwsh
        run: |
          if (!(Test-Path 'data/ourairports.min.json.gz')) {
            throw 'OurAirports offline catalog was not generated.'
          }
          $size = (Get-Item 'data/ourairports.min.json.gz').Length
          if ($size -lt 100000) {
            throw "OurAirports offline catalog is unexpectedly small: $size bytes"
          }
          Write-Host "OurAirports catalog: $size bytes"

      - name: Smoke test local EFB host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'flight-deck-efb-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'flight-deck-efb-smoke.err.log'
          $process = Start-Process -FilePath node -ArgumentList @('src/server.mjs', '--demo', '--port', '8745') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(25)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8745/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Flight Deck EFB') {
                  $ready = $true
                }
              } catch {
                # Host can take a moment to initialize on a fresh runner.
              }
            } until ($ready -or (Get-Date) -gt $deadline)

            if (!$ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Flight Deck EFB host smoke test did not become ready.'
            }
            Write-Host 'Flight Deck EFB host smoke test passed.'
          } finally {
            if ($process -and !$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          $existing = git tag --list $tag
          if ($existing -eq $tag) {
            Write-Host "Tag $tag already exists."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Flight Deck EFB $version"
            git push origin $tag
            Write-Host "Created and pushed tag $tag."
          }

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') }}
        run: npm run dist

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-EFB-Windows
          path: |
            dist/Flight-Deck-EFB-Setup-*.exe
            dist/Flight-Deck-EFB-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Record feature build status
        if: ${{ always() && github.ref == 'refs/heads/feature/full-efb-shell' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build-status -Force | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          status=${{ job.status }}
          commit=${{ github.sha }}
          version=$(node -p "require('./package.json').version")
          "@ | Set-Content -Path build-status/feature-latest.txt -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status/feature-latest.txt
          git commit -m "Record feature build status for run ${{ github.run_id }}" || exit 0
          git push origin HEAD:feature/full-efb-shell
