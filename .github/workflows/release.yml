name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version as a GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify application source
        shell: pwsh
        run: |
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check src/state-engine.mjs
          node --check public/app.js
          node --check public/i18n.js
          node --input-type=module -e "import updaterPackage from 'electron-updater'; if (!('autoUpdater' in updaterPackage)) throw new Error('electron-updater autoUpdater export missing'); console.log('electron-updater CommonJS export shape OK');"
          if (Test-Path 'src/navigraph-client.mjs') {
            throw 'Navigraph backend must remain disabled until explicitly re-enabled.'
          }
          $version = node -p "require('./package.json').version"
          Write-Host "Building Flight Deck EFB $version"

      - name: Build OurAirports offline catalog
        run: npm run prepare-data

      - name: Verify bundled airport data
        shell: pwsh
        run: |
          if (!(Test-Path 'data/ourairports.min.json.gz')) {
            throw 'OurAirports offline catalog was not generated.'
          }
          $size = (Get-Item 'data/ourairports.min.json.gz').Length
          if ($size -lt 100000) {
            throw "OurAirports offline catalog is unexpectedly small: $size bytes"
          }
          Write-Host "OurAirports catalog: $size bytes"

      - name: Smoke test local EFB host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'flight-deck-efb-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'flight-deck-efb-smoke.err.log'
          $process = Start-Process -FilePath node -ArgumentList @('src/server.mjs', '--demo', '--port', '8745') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(25)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8745/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Flight Deck EFB') {
                  $ready = $true
                }
              } catch {}
            } until ($ready -or (Get-Date) -gt $deadline)
            if (!$ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Flight Deck EFB host smoke test did not become ready.'
            }
            Write-Host 'Flight Deck EFB host smoke test passed.'
          } finally {
            if ($process -and !$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force
          if ((git tag --list $tag) -ne $tag) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag -m "Flight Deck EFB $version"
            git push origin $tag
          }
          Write-Host "Release tag: $tag"

      - name: Build Windows installer
        run: npm run dist

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/Flight Deck EFB.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable missing: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList @('--demo') -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Packaged Flight Deck EFB exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host 'Packaged Flight Deck EFB startup smoke test passed.'
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Verify updater assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $required = @(
            "dist/Flight-Deck-EFB-Setup-$version.exe",
            "dist/Flight-Deck-EFB-Setup-$version.exe.blockmap",
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing release asset: $file" }
          }
          $latest = Get-Content 'dist/latest.yml' -Raw
          if ($latest -notmatch "version:\s*$([regex]::Escape($version))") {
            throw "latest.yml does not advertise version $version."
          }

      - name: Publish GitHub release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $repo = '${{ github.repository }}'
          $assets = @(
            "dist/Flight-Deck-EFB-Setup-$version.exe",
            "dist/Flight-Deck-EFB-Setup-$version.exe.blockmap",
            'dist/latest.yml'
          )
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed.' }
            gh release edit $tag --repo $repo --draft=false --prerelease=false --title "Flight Deck EFB $version"
          } else {
            gh release create $tag @assets --repo $repo --title "Flight Deck EFB $version" --notes "Flight Deck EFB $version. Flight simulation use only — not for real-world navigation." --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing GitHub release failed.' }

      - name: Upload test-build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-EFB-Windows
          path: |
            dist/Flight-Deck-EFB-Setup-*.exe
            dist/Flight-Deck-EFB-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
