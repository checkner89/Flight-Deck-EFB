name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version as a GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Prepare restored Flight Deck EFB source
        shell: pwsh
        run: |
          $archive = 'legacy/Flight-Deck-EFB-1.2.2-source.zip'
          if (!(Test-Path $archive)) {
            throw "Missing $archive. Upload the prepared restored source package before running this workflow."
          }
          if (Test-Path 'app-source') {
            Remove-Item 'app-source' -Recurse -Force
          }
          Expand-Archive -Path $archive -DestinationPath . -Force
          if (!(Test-Path 'app-source/package.json')) {
            throw 'Restored source package did not contain app-source/package.json.'
          }
          Write-Host "Prepared Flight Deck EFB $(node -p \"require('./app-source/package.json').version\")"

      - name: Install dependencies
        working-directory: app-source
        run: npm install

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        run: |
          $version = node -p "require('./app-source/package.json').version"
          $tag = "v$version"
          git fetch --tags --force

          $existing = git tag --list $tag
          if ($existing -eq $tag) {
            Write-Host "Tag $tag already exists."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Flight Deck EFB $version"
            git push origin $tag
            Write-Host "Created and pushed tag $tag."
          }

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        working-directory: app-source
        run: npm run dist

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        working-directory: app-source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-EFB-Windows
          path: |
            app-source/dist/Flight-Deck-EFB-Setup-*.exe
            app-source/dist/Flight-Deck-EFB-Setup-*.exe.blockmap
            app-source/dist/latest.yml
          if-no-files-found: error
