name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this version as a GitHub Release'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Create release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags --force

          $existing = git tag --list $tag
          if ($existing -eq $tag) {
            Write-Host "Tag $tag already exists."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag -m "Flight Deck EFB $version"
            git push origin $tag
            Write-Host "Created and pushed tag $tag."
          }

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        run: npm run dist

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Deck-EFB-Windows
          path: |
            dist/Flight-Deck-EFB-Setup-*.exe
            dist/Flight-Deck-EFB-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
