name: Restore legacy EFB source

on:
  push:
    branches:
      - feature/full-efb-shell
    paths:
      - migration/efb-src.tar.gz.b64
      - .github/workflows/restore-legacy-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/full-efb-shell
          fetch-depth: 0

      - name: Restore Flight Deck EFB 1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          test -f migration/efb-src.tar.gz.b64
          base64 --decode migration/efb-src.tar.gz.b64 > /tmp/efb-src.tar.gz
          rm -rf public src data MSFS-2024-EFB-App scripts
          tar -xzf /tmp/efb-src.tar.gz -C .
          rm -rf migration
          rm -f .github/workflows/restore-legacy-source.yml

      - name: Verify restored source
        shell: bash
        run: |
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check public/app.js
          test "$(node -p "require('./package.json').version")" = "1.3.0"
          test ! -f src/navigraph-client.mjs

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete Flight Deck EFB 1.2.0 application source" || exit 0
          git push origin HEAD:feature/full-efb-shell
