name: Restore legacy EFB source

on:
  push:
    branches:
      - feature/full-efb-shell
    paths:
      - migration/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/full-efb-shell
          fetch-depth: 0

      - name: Reassemble and verify migration package
        shell: bash
        run: |
          set -euo pipefail
          test -f migration/READY
          count=$(find migration/chunks -maxdepth 1 -type f -name 'chunk-*.part' | wc -l)
          test "$count" -eq 19
          for i in $(seq -w 0 18); do
            test -f "migration/chunks/chunk-${i}.part"
          done
          cat $(find migration/chunks -maxdepth 1 -type f -name 'chunk-*.part' | sort) > /tmp/efb-src.tar.gz.b64
          echo '5492c6999e0990cc02222c1fee84ac7335ba66793e79ca1d778fcdc227cb904b  /tmp/efb-src.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/efb-src.tar.gz.b64 > /tmp/efb-src.tar.gz
          echo 'f319fc5a9687e751b292c217efc265b90ca488c1c330a4a235b26750abcae976  /tmp/efb-src.tar.gz' | sha256sum -c -

      - name: Restore Flight Deck EFB source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public src data MSFS-2024-EFB-App scripts
          tar -xzf /tmp/efb-src.tar.gz -C .
          rm -rf migration
          rm -f .github/workflows/restore-legacy-source.yml

      - name: Verify restored source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check public/app.js
          test "$(node -p "require('./package.json').version")" = "1.3.0"
          test ! -f src/navigraph-client.mjs
          test -f scripts/build-ourairports.mjs
          test -f public/assets/app-icon-512.png
          test -f MSFS-2024-EFB-App/src/FlightDeckEFB.tsx

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete Flight Deck EFB application source" || exit 0
          git push origin HEAD:feature/full-efb-shell
