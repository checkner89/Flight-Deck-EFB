name: Prepare 1.7.9 Map and Offline Planning

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.7.9-map-offline-planning.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: "github.event.head_commit.message == 'chore: prepare 1.7.9 map offline planning'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply 1.7.9 changes
        run: |
          python scripts/apply-1.7.9.py
          npm version 1.7.9 --no-git-tag-version

      - name: Verify 1.7.9 source
        run: |
          npm install
          node --check src/server.mjs
          node --check src/airport-map-service.mjs
          node --check public/app.js
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { buildOverpassQuery, convertOverpassPayload } from './src/airport-map-service.mjs';
          const query = buildOverpassQuery({ icao: 'EDDL', lat: 51.2895, lon: 6.7668 });
          assert.match(query, /aeroway/);
          assert.match(query, /taxiway/);
          assert.doesNotMatch(query, /flightDeckAirportArea/);
          const data = convertOverpassPayload({ elements: [{
            type: 'way', id: 1, tags: { aeroway: 'taxiway', ref: 'M' }, geometry: [
              { lat: 51.28, lon: 6.76 }, { lat: 51.281, lon: 6.761 },
            ],
          }] }, { icao: 'EDDL', lat: 51.2895, lon: 6.7668 });
          assert.equal(data.counts.taxiway, 1);
          console.log('Airport vector regression OK');
          NODE
          grep -q "tile.openstreetmap.org" public/app.js
          grep -q "flight-deck-airport-maps-v3" public/app.js
          grep -q "app.js?v=1.7.9" public/index.html
          grep -q "si-operations.js?v=1.7.9" public/index.html
          grep -q "service-worker.js?v=1.7.9" public/app.js
          if grep -q "app.js?v=1.7.2" public/index.html; then echo 'stale app cache-buster remains' >&2; exit 1; fi
          node -e "const p=require('./package.json'); if(p.version!=='1.7.9') throw new Error('version'); if(p.author!=='Christoph Heckner') throw new Error('author');"

      - name: Commit release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-1.7.9-map-offline-planning.yml
          git rm scripts/apply-1.7.9.py
          git add -A
          git commit -m 'Release 1.7.9 Real Airport Map and Standalone Taxi Planning'
          git push origin HEAD:main
