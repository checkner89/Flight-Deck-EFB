name: Apply Phase 3 1.7.0

on:
  push:
    branches:
      - phase3-native-intelligence-1.7.0
    paths:
      - '.github/workflows/apply-phase3-1.7.0.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v5
        with:
          ref: phase3-native-intelligence-1.7.0
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply Phase 3 migration
        run: python scripts/apply-phase3-1.7.0.py

      - name: Synchronize package lock and dependencies
        run: npm install

      - name: Syntax checks
        run: |
          node --check src/route-sync-service.mjs
          node --check src/flight-intelligence-engine.mjs
          node --check src/aircraft-adapter-manager.mjs
          node --check src/ground-safety-engine.mjs
          node --check src/gsx-client.mjs
          node --check src/simconnect-client.mjs
          node --check src/server.mjs
          node --check src/state-engine.mjs
          node --check public/flight-phases.js
          node --check public/app.js
          node --check public/service-worker.js

      - name: Phase 3 behavior checks
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { normalizeMsfsEfbRoute, buildFlightDeckRoute, compareRoutes } from './src/route-sync-service.mjs';
          import { evaluateTurnaround, evaluateAssistant } from './src/flight-intelligence-engine.mjs';
          import { resolveFlightPhase } from './public/flight-phases.js';

          const msfs = normalizeMsfsEfbRoute({
            departureAirport: { icao: 'EDDF' }, destinationAirport: { icao: 'LPPT' },
            departureRunway: { designation: '25C' }, destinationRunway: { designation: '03' },
            departure: { ident: 'ANEK1F' }, arrival: { ident: 'XAMAX3A' },
            cruiseAltitude: 36000,
            enroute: [{ ident: 'ANEKI' }, { ident: 'XAMAX' }],
          });
          assert.equal(msfs.departureAirport, 'EDDF');
          assert.equal(msfs.destinationAirport, 'LPPT');
          const state = {
            flight: { origin: 'EDDF', destination: 'LPPT', departureRunway: '25C', arrivalRunway: '03' },
            aircraft: { onGround: true, groundSpeed: 0, parkingBrake: true, enginesRunning: false },
            integrations: {
              simbrief: { imported: true, flight: { origin: 'EDDF', destination: 'LPPT', departureRunway: '25C', arrivalRunway: '03', sid: 'ANEK1F', star: 'XAMAX3A', waypoints: [{ ident: 'ANEKI', lat: 50, lon: 8 }, { ident: 'XAMAX', lat: 40, lon: -7 }] } },
              gsx: { installed: false, payload: {}, services: [] },
              groundSafety: { alerts: [] },
              routeSync: {},
              aviationWeather: { airports: [] },
              sayIntentions: { weather: { airports: [] } },
              flightIntelligence: { confidence: .97 },
            },
          };
          const deck = buildFlightDeckRoute(state);
          const comparison = compareRoutes(deck, msfs);
          assert.equal(comparison.status, 'matched');
          assert.ok(comparison.matchPercent >= 85);
          const turnaround = evaluateTurnaround(state, 'preflight');
          assert.ok(['working', 'ready'].includes(turnaround.status));
          const assistant = evaluateAssistant(state, 'preflight', turnaround);
          assert.equal(assistant.advisoryOnly, true);
          assert.equal(resolveFlightPhase({ integrations: { flightIntelligence: { phase: 'cruise' } } }, null, 'auto'), 'cruise');
          assert.equal(resolveFlightPhase({ integrations: { flightIntelligence: { phase: 'cruise' } } }, null, 'descent'), 'descent');
          console.log('Phase 3 behavior checks passed.');
          NODE

      - name: Verify native EFB source contract
        shell: bash
        run: |
          grep -q 'GET_EFB_ROUTE' MSFS-2024-EFB-App/src/FlightDeckEFB.tsx
          grep -q 'AvionicsRouteSync' MSFS-2024-EFB-App/src/FlightDeckEFB.tsx
          grep -q '39890' MSFS-2024-EFB-App/src/FlightDeckEFB.tsx
          ! grep -Eq 'SEND_ROUTE_TO_AVIONICS|SEND_ROUTE_TO_EFB|SAVE_EFB_ROUTE|GPS FLIGHT PLAN' MSFS-2024-EFB-App/src/FlightDeckEFB.tsx

      - name: Verify Phase 3 UI contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const html = fs.readFileSync('public/index.html', 'utf8');
          const app = fs.readFileSync('public/app.js', 'utf8');
          for (const id of [
            'home-assistant-status','home-assistant-detail','home-assistant-list',
            'flight-intelligence-status','flight-intelligence-phase','flight-intelligence-raw','flight-intelligence-confidence','flight-intelligence-detail','flight-intelligence-evidence',
            'route-sync-status','route-sync-flightdeck','route-sync-msfs','route-sync-match','route-sync-avionics','route-sync-detail','route-sync-differences',
            'turnaround-status','turnaround-stage','turnaround-progress','turnaround-progress-bar','turnaround-detail','turnaround-next','turnaround-blockers',
            'settings-intelligence-dot','settings-intelligence','settings-route-sync-dot','settings-route-sync'
          ]) {
            assert.ok(html.includes(`id="${id}"`), `HTML id missing: ${id}`);
            assert.ok(app.includes(`$('#${id}')`), `app binding missing: ${id}`);
          }
          assert.ok(app.includes('renderPhase3(state)'), 'renderPhase3 is not connected to renderState');
          console.log('Phase 3 UI contract passed.');
          NODE

      - name: Smoke test local host and native bridge
        shell: bash
        run: |
          node src/server.mjs --demo --port 8748 >/tmp/efb-phase3.out 2>/tmp/efb-phase3.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8748/ | grep -q 'Flight Deck EFB'; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8748/api/native/health | grep -q '1.7.0'
          curl --fail --silent -X OPTIONS -D /tmp/native-headers -o /dev/null http://127.0.0.1:8748/api/native/route
          grep -qi 'access-control-allow-origin: \*' /tmp/native-headers
          curl --fail --silent -H 'Content-Type: application/json' -d '{"route":{"departureAirport":{"icao":"EDDF"},"destinationAirport":{"icao":"LPPT"},"enroute":[{"ident":"ANEKI"}]}}' http://127.0.0.1:8748/api/native/route | grep -q 'accepted'
          curl --fail --silent http://127.0.0.1:8748/api/native/flight-deck-route | grep -q 'routeSync'
          echo 'Phase 3 native bridge smoke test passed.'

      - name: Verify version and documentation sweep
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = '1.7.0'
          grep -q 'data-app-version="1.7.0"' public/index.html
          grep -q 'flight-deck-efb-v170' public/service-worker.js
          grep -q 'Current release: 1.7.0' README.md
          grep -q 'Effective for version 1.7.0' PRIVACY.md
          grep -q 'Third-party notices — Flight Deck EFB 1.7.0' THIRD_PARTY_NOTICES.md
          grep -q '## 1.7.0 — Phase 3' CHANGELOG.md
          ! grep -R --exclude-dir=.git --exclude='apply-phase3-1.7.0.py' -nE 'Current release: 1\.6\.0|data-app-version="1\.6\.0"|Setup-1\.6\.0|flight-deck-efb-v160' README.md PRIVACY.md THIRD_PARTY_NOTICES.md public src package.json CHANGELOG.md

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Commit Phase 3 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md PRIVACY.md THIRD_PARTY_NOTICES.md package.json package-lock.json public src
          git commit -m 'Implement Phase 3 native EFB and flight intelligence'
          git push origin HEAD:phase3-native-intelligence-1.7.0
