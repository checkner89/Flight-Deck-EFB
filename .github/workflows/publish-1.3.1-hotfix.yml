name: Publish Flight Deck EFB 1.3.1 Hotfix

on:
  push:
    branches:
      - main
    paths:
      - 'release-1.3.1-trigger.txt'

permissions:
  contents: write

jobs:
  publish-hotfix:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify 1.3.1 hotfix source
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '1.3.1') { throw "Unexpected version $version" }
          node --check src/electron-main.mjs
          node --check src/server.mjs
          node --check src/simconnect-client.mjs
          node --check public/app.js
          node --input-type=module -e "import updaterPackage from 'electron-updater'; if (!('autoUpdater' in updaterPackage)) throw new Error('electron-updater autoUpdater export missing'); console.log('electron-updater CommonJS export shape OK');"
          if (Test-Path 'src/navigraph-client.mjs') { throw 'Navigraph backend must remain disabled in 1.3.1.' }

      - name: Build OurAirports offline catalog
        run: npm run prepare-data

      - name: Verify OurAirports data
        shell: pwsh
        run: |
          if (!(Test-Path 'data/ourairports.min.json.gz')) { throw 'OurAirports catalog missing.' }
          $size = (Get-Item 'data/ourairports.min.json.gz').Length
          if ($size -lt 100000) { throw "OurAirports catalog unexpectedly small: $size" }
          Write-Host "OurAirports catalog: $size bytes"

      - name: Smoke test local EFB host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'efb-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'efb-smoke.err.log'
          $process = Start-Process -FilePath node -ArgumentList @('src/server.mjs', '--demo', '--port', '8745') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(25)
            $ready = $false
            do {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8745/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'Flight Deck EFB') { $ready = $true }
              } catch {}
            } until ($ready -or (Get-Date) -gt $deadline)
            if (!$ready) {
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Flight Deck EFB host smoke test failed.'
            }
            Write-Host 'Flight Deck EFB host smoke test passed.'
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/Flight Deck EFB.exe'
          if (!(Test-Path $exe)) { throw "Packaged executable missing: $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList @('--demo') -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Packaged Flight Deck EFB exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host 'Packaged Flight Deck EFB startup smoke test passed.'
          } finally {
            if ($process -and !$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Verify updater assets
        shell: pwsh
        run: |
          $required = @(
            'dist/Flight-Deck-EFB-Setup-1.3.1.exe',
            'dist/Flight-Deck-EFB-Setup-1.3.1.exe.blockmap',
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing release asset: $file" }
          }
          $latest = Get-Content 'dist/latest.yml' -Raw
          if ($latest -notmatch 'version:\s*1\.3\.1') { throw 'latest.yml does not advertise version 1.3.1.' }

      - name: Create v1.3.1 tag
        shell: pwsh
        run: |
          git fetch --tags --force
          if ((git tag --list 'v1.3.1') -ne 'v1.3.1') {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v1.3.1 -m 'Flight Deck EFB 1.3.1'
            git push origin v1.3.1
          }

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $repo = 'checkner89/Flight-Deck-EFB'
          $assets = @(
            'dist/Flight-Deck-EFB-Setup-1.3.1.exe',
            'dist/Flight-Deck-EFB-Setup-1.3.1.exe.blockmap',
            'dist/latest.yml'
          )
          gh release view v1.3.1 --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.3.1 @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Uploading 1.3.1 assets failed.' }
            gh release edit v1.3.1 --repo $repo --draft=false --prerelease=false --title 'Flight Deck EFB 1.3.1'
          } else {
            gh release create v1.3.1 @assets --repo $repo --title 'Flight Deck EFB 1.3.1' --notes 'Hotfix: fixes the electron-updater CommonJS/ESM import crash in the Windows main process. Flight simulation use only — not for real-world navigation.' --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing GitHub release 1.3.1 failed.' }

      - name: Verify published release
        shell: pwsh
        run: |
          $json = gh release view v1.3.1 --repo checkner89/Flight-Deck-EFB --json tagName,isDraft,isPrerelease,url,assets | ConvertFrom-Json
          if ($json.tagName -ne 'v1.3.1') { throw 'Wrong release tag.' }
          if ($json.isDraft) { throw 'Release is still a draft.' }
          if ($json.isPrerelease) { throw 'Release is marked as prerelease.' }
          $names = @($json.assets | ForEach-Object { $_.name })
          foreach ($required in @('Flight-Deck-EFB-Setup-1.3.1.exe','Flight-Deck-EFB-Setup-1.3.1.exe.blockmap','latest.yml')) {
            if ($names -notcontains $required) { throw "Published release missing $required" }
          }
          Write-Host "Release URL: $($json.url)"

      - name: Record hotfix publish result
        if: ${{ always() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-status -Force | Out-Null
          @"
          status=${{ job.status }}
          version=1.3.1
          tag=v1.3.1
          run_id=${{ github.run_id }}
          "@ | Set-Content -Path release-status/1.3.1.txt -Encoding utf8
          git checkout main
          git pull origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/1.3.1.txt
          git commit -m 'Record Flight Deck EFB 1.3.1 hotfix publish result' || exit 0
          git push origin HEAD:main
