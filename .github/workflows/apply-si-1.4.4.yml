name: Apply SayIntentions 1.4.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-si-1.4.4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply SI operations integration
        run: python scripts/apply-si-1.4.4.py

      - name: Verify patched sources
        run: |
          node --check src/sayintentions-client.mjs
          node --check src/server.mjs
          node --check src/state-engine.mjs
          node --check public/app.js
          node --check public/si-operations.js
          node --check public/service-worker.js
          grep -q 'si-operations.js?v=1.4.4' public/index.html
          grep -q 'si-operations.css?v=1.4.4' public/index.html
          grep -q '"version": "1.4.4"' package.json
          grep -q "pathname === '/api/sayintentions/gate'" src/server.mjs
          grep -q "pathname === '/api/sayintentions/pause'" src/server.mjs
          grep -q "pathname === '/api/sayintentions/say'" src/server.mjs

      - name: Commit 1.4.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github/workflows/release.yml
          git rm scripts/apply-si-1.4.4.py
          git add src/sayintentions-client.mjs src/server.mjs src/state-engine.mjs public/index.html public/app.js public/service-worker.js public/si-operations.js public/si-operations.css package.json package-lock.json CHANGELOG.md
          git commit -m 'Release 1.4.4 SayIntentions operations'
          git push origin HEAD:main
